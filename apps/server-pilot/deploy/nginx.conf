server {
  listen 443 ssl;
  server_name nava.legacy.local;

  ssl_certificate     /etc/nginx/ssl/nava.crt;
  ssl_certificate_key /etc/nginx/ssl/nava.key;

  root /var/www/nava-mail;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://127.0.0.1:8788/health;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
