server {
  listen 80 default_server;
  server_name nava.legacyhotels.co.za;
  if ($host != nava.legacyhotels.co.za) {
    return 444;
  }
  # Redirect responses still carry the full legacy security header set.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
  return 301 https://nava.legacyhotels.co.za$request_uri;
}

server {
  listen 443 ssl default_server;
  server_name nava.legacyhotels.co.za;

  if ($host != nava.legacyhotels.co.za) {
    return 444;
  }

  ssl_certificate     /etc/nginx/ssl/nava.legacyhotels.co.za.fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/nava.legacyhotels.co.za.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Direct attachment fetches use five-minute presigned URLs on this exact bucket endpoint.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://nava-zero-mail-845242190536-af-south-1.s3.af-south-1.amazonaws.com; frame-ancestors 'none';" always;

  client_max_body_size 35m;
  root __NAVA_WEB_ROOT__;
  index index.html;

  # Exact native pane entry: alias serves the file here, without a redirect into
  # /index.html (which would replace this route's stricter script policy).
  location = /outlook-pane {
    alias __NAVA_WEB_ROOT__/releases/__NAVA_RELEASE_ID__/index.html;
    default_type text/html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Any location add_header cancels inheritance of every server add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __NAVA_PANE_SCRIPT_HASHES__; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://nava-zero-mail-845242190536-af-south-1.s3.af-south-1.amazonaws.com; frame-ancestors 'none';" always;
    expires -1;
  }

  # Canonicalize the slash form to the exact pane entry. Never let pane-like
  # subpaths reach the general SPA fallback with its more permissive CSP.
  location = /outlook-pane/ {
    return 308 /outlook-pane$is_args$args;
  }

  location ^~ /outlook-pane/ {
    return 404;
  }

  # React Router matches case-insensitively. Reject alternate spellings so
  # they cannot render the pane through the general SPA's weaker script policy.
  location ~* ^/outlook-pane(?:/|$) {
    return 404;
  }

  # Both the SPA fallback and direct /index.html requests switch with this
  # release's pane policy in a single validated Nginx reload.
  location = /index.html {
    alias __NAVA_WEB_ROOT__/releases/__NAVA_RELEASE_ID__/index.html;
    expires -1;
  }

  location = /api/mailto-handler {
    return 302 /mailto-handler$is_args$args;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://127.0.0.1:8788/health;
    proxy_set_header Host $host;
  }

  location = /download/NavaOutlookSetup.exe {
    alias /var/www/nava-mail/downloads/NavaOutlookSetup.exe;
    default_type application/vnd.microsoft.portable-executable;
    add_header Content-Disposition 'attachment; filename="NavaOutlookSetup.exe"';
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Current release wins. Only Vite-named chunks may fall back to the
  # append-only shared asset directory for tabs opened before a deployment.
  location ~ "^/assets/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|svg|png|jpe?g|webp|avif|wasm)$" {
    try_files /releases/__NAVA_RELEASE_ID__$uri $uri =404;
  }

  location /assets/ {
    try_files /releases/__NAVA_RELEASE_ID__$uri =404;
    expires -1;
  }

  location / {
    try_files /releases/__NAVA_RELEASE_ID__$uri /index.html;
    # `expires` does not cancel inheritance of server-level add_header directives.
    expires -1;
  }
}

server {
  listen 172.31.12.112:8443 default_server;
  server_name _;
  return 444;
}

server {
  listen 172.31.12.112:8443;
  server_name 172.31.12.112;

  if ($host != 172.31.12.112) {
    return 444;
  }

  # ALB health checks send Host: 172.31.12.112:8443.
  location = /health {
    proxy_pass http://127.0.0.1:8789/health;
    proxy_set_header Host $host;
  }

  location / {
    return 444;
  }
}

