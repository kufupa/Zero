services:
  gotenberg:
    image: gotenberg/gotenberg:8.36.0-libreoffice
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - gotenberg
      - --api-timeout=60s
      - --libreoffice-auto-start=true
      - --libreoffice-start-timeout=60s
      - --api-download-from-deny-private-ips=true
      - --api-download-from-deny-public-ips=true
      - --webhook-disable=true
