<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Offline, synthetic Outlook-style reservationist pane prototype.">
    <title>Nava Pane Demo</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f3f5f8;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --line: #dce2e9;
        --line-strong: #c6d0db;
        --ink: #18212b;
        --muted: #5a6673;
        --quiet: #7a8794;
        --blue: #1769aa;
        --blue-dark: #0d568f;
        --blue-soft: #eaf4fc;
        --green: #18794e;
        --green-soft: #e8f5ee;
        --amber: #805200;
        --amber-soft: #fff5df;
        --red: #a12d2d;
        --red-soft: #fff0ee;
        --radius: 8px;
        --shadow: 0 2px 8px rgb(21 42 63 / 6%);
      }

      * { box-sizing: border-box; }
      html, body { min-width: 320px; min-height: 100%; margin: 0; }
      body {
        background: var(--page);
        color: var(--ink);
        font: 13px/1.45 "Segoe UI", Arial, sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button, select { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      :focus-visible { outline: 3px solid #72b7eb; outline-offset: 2px; }
      .appbar {
        align-items: center;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        height: 52px;
        padding: 0 18px;
      }
      .app-mark {
        align-items: center;
        background: #e8f1fb;
        border-radius: 7px;
        color: var(--blue-dark);
        display: inline-flex;
        font-size: 14px;
        font-weight: 700;
        height: 28px;
        justify-content: center;
        width: 28px;
      }
      .app-name { font-size: 14px; font-weight: 700; }
      .app-context { color: var(--muted); margin-left: auto; }
      .offline-pill, .status-pill, .tag {
        align-items: center;
        border-radius: 999px;
        display: inline-flex;
        font-size: 11px;
        font-weight: 600;
        gap: 5px;
        line-height: 1.2;
        padding: 4px 8px;
        white-space: nowrap;
      }
      .offline-pill { background: var(--amber-soft); color: var(--amber); }
      .app-shell {
        display: grid;
        grid-template-columns: 224px minmax(320px, 1fr) minmax(370px, 420px);
        height: calc(100vh - 52px);
        min-height: 560px;
      }
      .mail-nav, .mail-reader, .nava-pane { min-width: 0; }
      .mail-nav {
        background: #f8fafc;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .nav-heading {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        padding: 17px 14px 9px;
        text-transform: uppercase;
      }
      .case-list { min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
      .case-link {
        border: 1px solid transparent;
        border-radius: 7px;
        color: var(--ink);
        display: block;
        margin: 2px 0;
        min-width: 0;
        padding: 9px 9px 8px;
        text-decoration: none;
      }
      .case-link:hover { background: #eef3f8; }
      .case-link[aria-current="page"] {
        background: #e8f2fb;
        border-color: #c8def1;
        color: #113e62;
      }
      .case-subject, .case-sender {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .case-subject { font-size: 12px; font-weight: 600; }
      .case-sender { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .case-kind { color: var(--quiet); font-size: 10px; margin-top: 5px; }
      .nav-footnote {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        margin-top: auto;
        padding: 11px 13px;
      }
      .mail-reader {
        background: #eef2f6;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .reader-toolbar {
        align-items: center;
        background: #fff;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        display: flex;
        height: 42px;
        padding: 0 16px;
      }
      .message-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin: 18px auto;
        max-width: 760px;
        min-height: 280px;
        overflow: auto;
        padding: 22px 24px;
        width: calc(100% - 36px);
      }
      .message-subject { font-size: 19px; font-weight: 650; line-height: 1.25; margin: 0 0 16px; }
      .message-from { color: var(--muted); font-size: 12px; }
      .message-from strong { color: var(--ink); }
      .message-date { color: var(--quiet); font-size: 11px; margin-top: 3px; }
      .message-divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
      .message-body { color: #293541; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
      .message-empty { color: var(--quiet); font-style: italic; }
      .nava-pane {
        background: var(--surface);
        border-left: 1px solid var(--line-strong);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .pane-heading {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 8px;
        min-height: 48px;
        padding: 8px 14px;
      }
      .pane-heading strong { font-size: 14px; }
      .pane-status { color: var(--muted); font-size: 11px; margin-left: auto; }
      .pane-scroll { min-height: 0; overflow-y: auto; padding: 12px 14px 20px; }
      .selected-email {
        background: var(--surface-muted);
        border: 1px solid var(--line);
        border-radius: 7px;
        margin-bottom: 11px;
        padding: 9px 10px;
      }
      .selected-email-title { font-size: 12px; font-weight: 650; line-height: 1.35; }
      .selected-email-meta { align-items: flex-start; color: var(--muted); display: flex; flex-wrap: wrap; font-size: 11px; gap: 4px 8px; margin-top: 4px; overflow-wrap: anywhere; }
      .read-as-row { align-items: center; display: grid; gap: 8px; grid-template-columns: 64px 1fr; margin-bottom: 12px; }
      .read-as-row label, .field-label { color: #344251; font-size: 11px; font-weight: 650; }
      .read-as-select, .control {
        background: #fff;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--ink);
        min-height: 32px;
        padding: 5px 8px;
        width: 100%;
      }
      .reply-textarea { line-height: 1.5; min-height: 132px; resize: vertical; }
      .pane-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0 12px; }
      .primary-button, .secondary-button, .quiet-button {
        align-items: center;
        border: 1px solid transparent;
        border-radius: 5px;
        display: inline-flex;
        font-size: 12px;
        font-weight: 650;
        justify-content: center;
        min-height: 32px;
        padding: 6px 10px;
      }
      .primary-button { background: var(--blue); color: #fff; }
      .primary-button:hover:not(:disabled) { background: var(--blue-dark); }
      .secondary-button { background: #fff; border-color: var(--line-strong); color: #263747; }
      .secondary-button:hover:not(:disabled), .quiet-button:hover:not(:disabled) { background: #f1f5f8; }
      .quiet-button { background: transparent; border-color: var(--line); color: var(--muted); }
      .full-width { width: 100%; }
      .needs-you {
        background: var(--blue-soft);
        border: 1px solid #d5e8f7;
        border-radius: 6px;
        color: #25455f;
        font-size: 11px;
        margin-bottom: 12px;
        padding: 8px 9px;
      }
      .needs-you strong { display: block; font-size: 11px; margin-bottom: 2px; }
      .section-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        margin: 9px 0;
        padding: 10px;
      }
      .section-card h2, .section-card h3 { font-size: 13px; line-height: 1.35; margin: 0 0 8px; }
      .section-card h3 { font-size: 12px; }
      .muted { color: var(--muted); }
      .quiet { color: var(--quiet); }
      .small { font-size: 11px; }
      .field-stack { display: grid; gap: 8px; grid-template-columns: 1fr; }
      .field { display: grid; gap: 4px; min-width: 0; }
      .field-label { align-items: baseline; display: flex; gap: 4px; }
      .field-marker { color: var(--muted); font-size: 10px; font-weight: 700; }
      .help-text { color: var(--muted); font-size: 10px; line-height: 1.35; }
      .two-col { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
      .assumption {
        background: var(--amber-soft);
        border: 1px solid #f0dfb9;
        border-radius: 6px;
        color: var(--amber);
        font-size: 11px;
        margin: 6px 0;
        padding: 7px 8px;
      }
      .room-row, .change-row, .match-row {
        border-top: 1px solid #edf0f3;
        display: grid;
        gap: 6px;
        padding: 8px 0;
      }
      .room-row:first-of-type, .change-row:first-of-type, .match-row:first-of-type { border-top: 0; }
      .room-row { grid-template-columns: minmax(0, 1fr) auto; }
      .room-title { font-weight: 650; }
      .room-detail { color: var(--muted); font-size: 11px; }
      .room-count { align-self: start; background: #f1f5f8; border-radius: 5px; color: #3d4d5c; padding: 3px 7px; }
      .proposal {
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 7px 0;
        padding: 8px;
      }
      .proposal[aria-checked="true"] { background: #f2f8fc; border-color: #8bb8d9; }
      .proposal-head { align-items: flex-start; display: flex; gap: 8px; }
      .proposal-name { font-weight: 650; }
      .proposal-plan { color: var(--muted); font-size: 10px; margin-top: 2px; }
      .proposal-rate { margin-left: auto; max-width: 116px; }
      .proposal-total { color: #34485b; font-size: 11px; font-weight: 650; margin-top: 7px; }
      .output-box { background: #f7fafc; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .output-box[data-output-state="stale"] { background: var(--amber-soft); border-color: #e8d7b4; }
      .output-total { font-size: 14px; font-weight: 700; margin: 3px 0; }
      .output-status { color: var(--muted); font-size: 10px; }
      .workflow-view { min-width: 0; }
      .workflow-title { align-items: center; display: flex; justify-content: space-between; margin: 0 0 6px; }
      .workflow-title h1 { font-size: 16px; line-height: 1.25; margin: 0; }
      .tag { background: #eef3f7; color: #455564; }
      .tag-green { background: var(--green-soft); color: var(--green); }
      .tag-amber { background: var(--amber-soft); color: var(--amber); }
      .field-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .booking-groups { display: grid; gap: 7px; }
      .booking-group {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        min-width: 0;
      }
      .booking-group summary {
        align-items: center;
        color: #263747;
        cursor: pointer;
        display: flex;
        font-size: 12px;
        font-weight: 700;
        justify-content: space-between;
        list-style: none;
        min-height: 36px;
        padding: 7px 9px;
      }
      .booking-group summary::-webkit-details-marker { display: none; }
      .booking-group summary::after { color: var(--quiet); content: "+"; font-size: 16px; }
      .booking-group[open] summary::after { content: "−"; }
      .booking-fields { border-top: 1px solid #edf0f3; display: grid; gap: 9px; padding: 9px; }
      .field-check { align-items: center; display: flex; gap: 7px; min-height: 32px; }
      .field-check input { accent-color: var(--blue); height: 16px; width: 16px; }
      .lookup-controls { align-items: center; display: flex; gap: 5px; min-width: 0; }
      .lookup-controls .control { flex: 1; min-width: 0; }
      .lookup-clear { flex: none; min-height: 32px; padding: 5px 8px; }
      .cms-results { background: #fff; border: 1px solid var(--line-strong); border-radius: 5px; margin-top: 4px; max-height: 160px; overflow: auto; padding: 3px; }
      .cms-results[hidden] { display: none; }
      .cms-option { background: #fff; border: 0; border-radius: 4px; color: var(--ink); display: block; padding: 6px; text-align: left; width: 100%; }
      .cms-option:hover, .cms-option:focus-visible { background: var(--blue-soft); }
      .cms-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; margin-right: 7px; }
      .cms-selection { color: var(--muted); font-size: 10px; margin-top: 4px; }
      .review-list { display: grid; gap: 7px; }
      .review-item { border-top: 1px solid #edf0f3; padding-top: 7px; }
      .review-item:first-child { border-top: 0; padding-top: 0; }
      .review-question { font-weight: 650; }
      .review-answer, .review-comment { color: var(--muted); font-size: 11px; margin-top: 2px; overflow-wrap: anywhere; }
      .status-message { color: var(--muted); font-size: 11px; min-height: 18px; padding: 2px 1px; }
      .status-message[data-tone="success"] { color: var(--green); }
      .status-message[data-tone="warning"] { color: var(--amber); }
      .status-message[data-tone="error"] { color: var(--red); }
      .dialog-backdrop {
        align-items: center;
        background: rgb(13 27 40 / 36%);
        display: flex;
        inset: 0;
        justify-content: center;
        padding: 16px;
        position: fixed;
        z-index: 5;
      }
      .dialog-backdrop[hidden] { display: none; }
      .dialog-card { background: #fff; border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 16px 50px rgb(10 24 38 / 22%); max-width: 420px; padding: 17px; width: 100%; }
      .dialog-card h2 { font-size: 15px; margin: 0 0 5px; }
      .dialog-card p { color: var(--muted); font-size: 11px; margin: 0 0 12px; }
      .age-list { display: grid; gap: 7px; margin: 10px 0; }
      .dialog-error { color: var(--red); font-size: 11px; margin-top: 7px; }
      .dialog-error[hidden] { display: none; }
      .dialog-footer { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; margin-top: 13px; }
      .review-area { margin-top: 12px; }
      .review-area details summary { color: #344251; cursor: pointer; font-size: 12px; font-weight: 700; }
      .review-area details[open] summary { margin-bottom: 8px; }
      .legend { color: var(--muted); font-size: 10px; margin: 7px 0 2px; }
      .empty-state { background: #f8fafc; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--muted); font-size: 11px; padding: 10px; }
      .sr-only { clip: rect(0, 0, 0, 0); clip-path: inset(50%); height: 1px; overflow: hidden; position: absolute; white-space: nowrap; width: 1px; }

      @media (max-width: 1040px) {
        .app-shell { grid-template-columns: 195px minmax(280px, 1fr) 370px; }
        .pane-scroll { padding-left: 11px; padding-right: 11px; }
      }
      @media (max-width: 820px) {
        .app-shell { display: flex; flex-direction: column; height: auto; min-height: calc(100vh - 52px); }
        .mail-nav { border-bottom: 1px solid var(--line); border-right: 0; flex: none; max-height: 142px; }
        .nav-heading { padding: 9px 12px 5px; }
        .case-list { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 0 10px 8px; }
        .case-link { flex: 0 0 210px; margin: 0; }
        .nav-footnote { display: none; }
        .mail-reader { flex: none; max-height: 280px; min-height: 220px; }
        .message-card { margin: 10px auto; min-height: 140px; padding: 15px; width: calc(100% - 20px); }
        .message-subject { font-size: 16px; }
        .nava-pane { border-left: 0; border-top: 1px solid var(--line-strong); min-height: 65vh; }
        .pane-scroll { overflow: visible; }
      }
      @media (max-width: 440px) {
        .appbar { gap: 8px; height: 48px; padding: 0 12px; }
        .app-shell { min-height: calc(100vh - 48px); }
        .app-context { font-size: 10px; }
        .offline-pill { font-size: 10px; padding: 4px 6px; }
        .message-card { width: calc(100% - 16px); }
        .pane-heading, .pane-scroll { padding-left: 12px; padding-right: 12px; }
        .two-col, .field-grid { grid-template-columns: 1fr; }
      }

/* Original Outlook shell, with the current compact Nava pane. */

*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#1e293b;font-size:13px;background:#fff}
button,select,input,textarea{font:inherit;color:inherit}
svg.lucide{width:14px;height:14px;stroke-width:2;flex:none}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;height:100vh}

/* left: Outlook folder-style list */
.nav{background:#faf9f8;border-right:1px solid #e1dfdd;overflow:auto;padding:14px 10px}
.brand{display:flex;gap:9px;align-items:center;padding:0 6px 12px}
.brand .lg{width:28px;height:28px;border-radius:4px;background:#1a4332;color:#fff;display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:14px}.brand span{font-size:11.5px;color:#605e5c}
.grp{font-size:11px;font-weight:600;color:#605e5c;margin:14px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.it{display:block;padding:7px 9px;border-radius:4px;color:#242424;text-decoration:none;line-height:1.35;cursor:pointer}
.it:hover{background:#edebe9}
.it.on{background:#deecf9}
.it b{display:block;font-weight:600;font-size:13px}
.it span{display:block;font-size:12px;color:#605e5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.on b{color:#0f548c}

/* middle: Outlook reading pane */
.read{display:flex;flex-direction:column;min-width:0}
.tb{height:44px;flex:none;border-bottom:1px solid #e1dfdd;display:flex;align-items:center;gap:2px;padding:0 14px;color:#323130}
.tb span{display:inline-flex;gap:6px;align-items:center;padding:6px 9px;border-radius:4px}
.tb span:hover{background:#f3f2f1}
.rs{overflow:auto;flex:1}
.rin{max-width:820px;padding:22px 36px 60px}
.rin h1{font-size:20px;font-weight:600;margin:0 0 16px}
.snd{display:flex;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:#c7e0f4;color:#0f548c;display:grid;place-items:center;font-weight:600;flex:none}
.snd .w{flex:1}.snd .w div{font-size:12px;color:#605e5c;margin-top:2px}
.snd time{font-size:12px;color:#605e5c}
.mb{margin:18px 0 0 48px;white-space:pre-wrap;line-height:1.6;font-size:14px;color:#242424}
.mb mark{background:#fff4ce;color:inherit;padding:0 1px}
.qs{margin:28px 0 0 48px;border-top:1px solid #e1dfdd;padding-top:18px}
.qs h2{font-size:15px;margin:0 0 4px}
.qs p.l{margin:0 0 12px;color:#605e5c;font-size:13px}
.q{border:1px solid #e1dfdd;border-radius:4px;padding:12px 14px;margin-bottom:8px}
.q .d{font-weight:600;line-height:1.45}
.q .y{color:#605e5c;margin-top:4px;line-height:1.5}
.q .a{margin-top:8px;line-height:1.5}.q .a b{color:#0066cc}
.q .o{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.q .o button{border:1px solid #cbd5e1;background:#fff;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.q .o button.on{background:#1a4332;border-color:#1a4332;color:#fff}
.q textarea{width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:3px;padding:6px 8px;font-size:12.5px;min-height:32px;resize:vertical}


.app { grid-template-columns: 250px minmax(0, 1fr) 400px; }
.nav .case-list { overflow: visible; padding: 0; }
.nav .it[aria-current="page"] { background: #deecf9; }
.nav .it[aria-current="page"] b { color: #0f548c; }
.read { background: #fff; overflow: hidden; }
.rs { min-height: 0; }
.rin { width: 100%; }
.rin h1.message-subject { font-size: 20px; margin: 0 0 16px; }
.message-from { font-size: 13px; color: #242424; }
.message-date { margin-top: 0; }
.message-body { overflow-wrap: anywhere; }
.pane { background: #fff; border-left: 1px solid #cbd5e1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-heading { flex: none; min-height: 40px; padding: 0 14px; border-bottom: 1px solid #e2e8f0; }
.pane-heading strong { font-size: 13px; }
.pane-mark { display:grid; place-items:center; width:20px; height:20px; border-radius:3px; background:#1a4332; color:white; font-size:11px; font-weight:800; }
.pane-needs { margin-left:auto; color:#0066cc; font-size:11.5px; font-weight:600; }
.demo-indicator { color:#64748b; font-size:10px; font-weight:600; }
.mailbox-row { display:flex; align-items:center; gap:6px; min-height:32px; padding:0 14px; border-bottom:1px solid #e2e8f0; background:#f8fafc; color:#475569; font-size:11px; }
.mailbox-row i { width:8px; height:8px; border-radius:50%; background:#64748b; }
.pane-status { color:#475569; font-size:11px; margin-left:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mailbox-row .mailbox-note { margin-left:auto; white-space:nowrap; }
.pane-scroll { flex:1; min-height:0; overflow-y:auto; padding:8px 12px 20px; }
.selected-email { background:#fff; border:1px solid #e2e8f0; border-radius:4px; padding:8px 10px; margin-bottom:8px; }
.selected-email-title { font-size:13px; font-weight:700; color:#1e293b; }

ption>\u003c/select>\n        \u003cbutton class=\"secondary-button\" id=\"prefill\">Bring in background data\u003c/button>\n        \u003ca href=\"centurion-review.prototype.html?variant=b\">Earlier layout examples\u003c/a>\n        \u003cp>Synthetic example. No HMS connection or email.\u003c/p>\n      \u003c/div>\n      \u003cpre id=\"state-readout\" hidden>\u003c/pre>\n    \u003c/aside>\n    \u003csection class=\"read\" aria-label=\"Selected email\">\n      \u003cdiv class=\"tb\" aria-label=\"Outlook toolbar\">\u003cspan>\u21b6 Reply\u003c/span>\u003cspan>\u21b6 Reply all\u003c/span>\u003cspan>\u2192 Forward\u003c/span>\u003cspan>\u25a3 Archive\u003c/span>\u003cspan>Message 1 of 1\u003c/span>\u003c/div>\n      \u003cdiv class=\"rs\">\u003cdiv class=\"rin\">\n        \u003ch1 class=\"message-subject\">Booking request \u00b7 two rooms\u003c/h1>\n        \u003cdiv class=\"snd\">\u003cdiv class=\"av\">S\u003c/div>\u003cdiv class=\"w\">\u003cdiv class=\"message-from\">\u003cb>Sample travel agent\u003c/b> \u00b7 agent@example.test\u003c/div>\u003cdiv>To: centurion@example.test\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv class=\"mb message-body\">Hello,\n\nPlease arrange two rooms at Centurion, 12\u201314 November 2027, including breakfast. One guest is travelling with a child aged 8.\n\nWe also need one airport transfer on arrival. Please send the confirmation to our reservations address.\n\nThank you.\u003c/div>\n      \u003c/div>\u003c/div>\n    \u003c/section>\n    \u003caside class=\"pane\" aria-label=\"Nava reservationist pane\">\n      \u003cheader class=\"pane-heading\">\u003cspan class=\"pane-mark\" aria-hidden=\"true\">N\u003c/span>\u003cstrong>Nava Reservationist\u003c/strong>\u003cspan class=\"pane-needs\">Needs you\u003c/span>\u003cspan class=\"demo-indicator\">Demo\u003c/span>\u003c/header>\n      \u003cdiv class=\"mailbox-row\">\u003ci aria-hidden=\"true\">\u003c/i>\u003cspan class=\"pane-status\">Local \u00b7 not syncing\u003c/span>\u003cspan class=\"mailbox-note\">Not connected\u003c/span>\u003c/div>\n      \u003cmain class=\"pane-scroll\" id=\"pane-scroll\">\n        \u003csection class=\"selected-email\" aria-label=\"Selected email summary\">\u003cdiv class=\"selected-email-meta\">Sample travel agent \u00b7 agent@example.test\u003c/div>\u003cdiv class=\"selected-email-title\">Booking request \u00b7 two rooms\u003c/div>\u003c/section>\n        \u003cdiv class=\"read-as-row\">\u003clabel for=\"read-as-select\">Nava reads this as:\u003c/label>\u003cselect class=\"read-as-select\" id=\"read-as-select\" aria-label=\"Nava reads this as\">\u003coption>Booking\u003c/option>\u003c/select>\u003c/div>\n        \u003cdiv class=\"needs-you\">\u003cstrong>Needs you\u003c/strong>\u003cspan>Review the proposed booking and confirmation.\u003c/span>\u003c/div>\n        \u003cdiv class=\"workflow-title\">\u003ch1>Booking review\u003c/h1>\u003cspan class=\"tag tag-green\">Draft\u003c/span>\u003c/div>\n        \u003cdiv id=\"review\">\u003c/div>\n        \u003cdiv class=\"approval\" id=\"approval\">\u003c/div>\n      \u003c/main>\n    \u003c/aside>\n  \u003c/div>\n  \u003cdiv id=\"modal-root\">\u003c/div>\n\n\u003cscript>\n    const values = {\n      agency: 'Tourvest Travel Services \u00b7 Roggebaai', organization: '', arAccount: '', billingReference: '',\n      arrival: '2027-11-12', nights: '2', departure: '2027-11-14', adults: { queen: '1', twin: '1' },\n      reason: '', source: 'Email', walkIn: false, ignoreRestrictions: false, commission: '', note: '',\n      guarantee: 'Awaiting Voucher', roomType: { queen: 'STQN \u00b7 Standard Queen', twin: 'STWN \u00b7 Standard Twin' },\n      chargeRoomType: { queen: '', twin: '' }, ratePlan: { queen: 'Agency B&B \u00b7 sample', twin: 'Agency B&B \u00b7 sample' },\n      promotion: { queen: '', twin: '' }, mealPlan: { queen: 'Bed & Breakfast', twin: 'Bed & Breakfast' },\n      resortFee: { queen: '', twin: '' }, market: { queen: 'Wholesale \u00b7 sample', twin: 'Wholesale \u00b7 sample' },\n      track: { queen: 'Agency rate \u00b7 sample', twin: 'Agency rate \u00b7 sample' }, confidentialRate: false,\n      assignedRoom: { queen: '', twin: '' }, doNotMove: false, doNotMoveReason: '', scheduledRoom: { queen: '', twin: '' },\n      waitlistPriority: '', bookerName: 'Sample travel agent', bookerContact: 'agent@example.test', authorisedBy: '',\n      profileId: { queen: 'EX-PROFILE-Q', twin: 'EX-PROFILE-T' }, title: { queen: '', twin: '' },\n      lastName: { queen: 'Example', twin: 'Example' }, firstName: { queen: 'Alex', twin: 'Jordan' },\n      vip: { queen: '', twin: '' }, gender: { queen: '', twin: '' }, phoneType: { queen: '', twin: '' },\n      phoneNumber: { queen: '', twin: '' }, mobileNumber: { queen: '', twin: '' }, emailType: { queen: '', twin: '' },\n      emailAddress: { queen: '', twin: '' }, autoEmailFolio: { queen: false, twin: false }, legacyMarketing: { queen: false, twin: false },\n      lifestyleMarketing: { queen: false, twin: false }, legacyMember: { queen: false, twin: false }, terms: { queen: false, twin: false },\n      language: { queen: '', twin: '' }, passportReference: { queen: '', twin: '' },\n      passportDate: { queen: '', twin: '' }, addressType: { queen: '', twin: 'Billing \u00b7 sample' },\n      address: { queen: '', twin: '' }, city: { queen: '', twin: '' }, postalCode: { queen: '', twin: '' },\n      country: { queen: '', twin: '' }, province: { queen: '', twin: '' }, nationality: { queen: '', twin: '' },\n      residence: { queen: '', twin: '' }, vat: { queen: '', twin: '' }, vehicle: { queen: '', twin: '' },\n      birthDate: { queen: '', twin: '' }, turndown: { queen: '', twin: '' }, cleaning: { queen: '', twin: '' },\n      settlementType: '', noPost: false,\n      flags: '', externalReference: '', agencyContract: '', wifiVoucher: '', wifiStatus: '', reservationSettlementType: '',\n      group: '', individualGroup: '', depositDueAmount: '', depositDueDate: '', depositReceived: '', balance: '',\n      lastProperty: '', lastRoom: '', lastCheckout: '', cmsFormStatus: '', cmsSend: true,\n      cmsMessage: '03 \u00b7 sample confirmation', cmsEmail: 'reservations@example.test',\n      lifetimeRevenue: '', lifetimeNights: '', lifetimeStays: '', loyalty: '', legacyPoints: '',\n      legacyLifestyleUpdate: false, newExistingMember: false,\n      addOn: 'Airport transfer \u00b7 sample', addOnDate: '2027-11-12', addOnTime: '10:30', addOnRoom: 'twin', addOnQuantity: '1',\n    };\n    const params = new URL(window.location.href).searchParams;\n    if (document.body.classList.contains('embed-review')) document.documentElement.classList.add('embed-review-root');\n    const scenarios = ['ready', 'missing', 'changed', 'partial', 'uncertain', 'success'];\n    const scenario = scenarios.includes(params.get('scenario')) ? params.get('scenario') : 'ready';\n    const state = { values, scenario, cmsMode: 'permitted', expanded: {}, dirty: {}, conflicts: {}, unbound: {}, lookup: null,\n      children: { queen: [], twin: [{ name: 'Taylor Example', age: scenario === 'missing' ? '' : '8' }] },\n      childEditor: false, rates: 'ready', rateChanged: scenario === 'changed', prefillArrived: false, recoveryOpen: false };\n    let lookupGeneration = 0;\n    const esc = (value) => String(value ?? '').replaceAll('&', '&amp;').replaceAll('\u003c', '&lt;').replaceAll('>', '&gt;').replaceAll('\"', '&quot;').replaceAll(\"'\", '&#39;');\n    const money = (value) => 'R' + Number(value).toLocaleString('en-ZA');\n    const filled = (value) => typeof value === 'boolean' ? value : value !== '' && value !== null && value !== undefined;\n    const hasOutcome = () => ['partial', 'uncertain', 'success'].includes(state.scenario);\n    const cmsIncluded = () => state.cmsMode === 'permitted' && state.values.cmsSend;\n    const rooms = ['queen', 'twin'];\n    const roomTypeLabel = (room) => String(state.values.roomType[room]).split(' \u00b7 ').slice(1).join(' \u00b7 ') || state.values.roomType[room] || 'Room type needed';\n    const roomLabel = (room) => {\n      const label = roomTypeLabel(room);\n      if (rooms.filter((other) => roomTypeLabel(other) === label).length === 1) return label;\n      const name = state.values.firstName[room] || state.values.profileId[room];\n      const sameName = rooms.some((other) => other !== room && state.values.firstName[other] === state.values.firstName[room]);\n      return `${label} \u00b7 ${name}${sameName ? ' \u00b7 ' + state.values.profileId[room] : ''}`;\n    };\n    const childAgesValid = () => rooms.every((room) => state.children[room].every((child) => /^\\d{1,2}$/.test(child.age) && Number(child.age) \u003c= 17 && child.name.trim()));\n    function nightDates() {\n      const start = Date.parse(state.values.arrival + 'T12:00:00Z');\n      const end = Date.parse(state.values.departure + 'T12:00:00Z');\n      const count = (end - start) / 86400000;\n      if (!Number.isInteger(count) || count \u003c 1 || count > 7) return [];\n      return Array.from({ length: count }, (_, index) => new Date(start + index * 86400000).toISOString().slice(0, 10));\n    }\n    function dateLabel(value) {\n      if (!/^\\d{4}-\\d\\d-\\d\\d$/.test(value || '')) return '\u2014';\n      const date = new Date(value + 'T12:00:00Z');\n      return Number.isNaN(date.getTime()) ? '\u2014' : date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });\n    }\n    function prices() {\n      const dates = nightDates();\n      const sampleBase = { STQN: 1200, STWN: 1400, DLXQN: 1800, DLXTWN: 2000 };\n      const nightly = Object.fromEntries(rooms.map((room) => [room, dates.map((_, i) => (sampleBase[state.values.roomType[room].split(' \u00b7 ')[0]] ?? 0) + (i % 2) * 100 + (state.values.ratePlan[room].startsWith('BAR') ? 200 : 0) + (state.rateChanged && room === 'twin' && i === 1 ? 100 : 0))]));\n      const totals = Object.fromEntries(rooms.map((room) => [room, nightly[room].reduce((sum, value) => sum + value, 0)]));\n      const addOn = state.values.addOn === 'None' ? 0 : Math.max(0, Number(state.values.addOnQuantity) || 0) * 350;\n      return { dates, nightly, totals, addOn, grand: totals.queen + totals.twin + addOn };\n    }\n    function childBands(room) {\n      const ages = state.children[room].map((child) => child.age);\n      if (ages.some((age) => !/^\\d{1,2}$/.test(age) || Number(age) > 17)) return ['\u2014', '\u2014', '\u2014'];\n      return [ages.filter((age) => Number(age) \u003c= 2).length, ages.filter((age) => Number(age) >= 3 && Number(age) \u003c= 12).length, ages.filter((age) => Number(age) >= 13).length];\n    }\n    function selectionKey() { return JSON.stringify([state.values.agency, state.values.arrival, state.values.departure, state.values.adults, state.values.roomType, state.values.ratePlan, state.values.track, state.children]); }\n    const sampleIneligible = () => state.values.agency === 'No agency' && rooms.some((room) => state.values.ratePlan[room].startsWith('Agency') || state.values.track[room].startsWith('Agency'));\n    function refreshRates() {\n      lookupGeneration += 1;\n      if (!nightDates().length || !childAgesValid()) { state.rates = 'needs-details'; return; }\n      state.rates = 'checking';\n      const version = lookupGeneration, key = selectionKey();\n      setTimeout(() => { if (version === lookupGeneration && key === selectionKey()) { state.rates = 'ready'; render(); } }, 700);\n    }\n    const field = (key, label, kind, always = false, options = [], extra = {}) => ({ key, label, kind, always, options, ...extra });\n    const STAY = [\n      field('agency', 'Primary Booking Agency', 'lookup', true), field('organization', 'Organization', 'lookup'),\n      field('arAccount', 'A/R Account', 'lookup'), field('billingReference', 'Billing Reference', 'text'),\n      field('arrival', 'Arrival Date', 'date', true, [], { required: true }), field('nights', 'Nights', 'number', true),\n      field('departure', 'Departure Date', 'date', true, [], { required: true }), field('adults', 'Adults', 'pair-select', true, Array.from({length: 16}, (_, i) => String(i + 1))),\n      field('child0', 'Child 0\u201302', 'band', true, [], { band: 0 }), field('child3', 'Child 03\u201312', 'band', true, [], { band: 1 }),\n      field('child13', 'Child 13\u201317', 'band', true, [], { band: 2 }), field('children', 'Children', 'children', true),\n      field('reason', 'Reason for Stay', 'select', false, ['', 'Business \u00b7 sample', 'Leisure \u00b7 sample']),\n      field('source', 'Source of Business', 'lookup', true), field('walkIn', 'Walk In', 'checkbox'),\n      field('ignoreRestrictions', 'Ignore All Restrictions', 'checkbox'), field('commission', 'Commission Percent', 'readonly'),\n      field('note', 'Reservation Note / Billing Instructions', 'textarea', true),\n      field('guarantee', 'Guarantee Type', 'select', true, ['Awaiting Voucher', 'Guaranteed By Agent', 'Guaranteed By Company', 'Non-Guaranteed Individual']),\n      field('roomType', 'Room Type', 'pair-lookup', true), field('chargeRoomType', 'Room Type for Charge', 'pair-lookup'),\n      field('ratePlan', 'Rate Plan', 'pair-lookup', true), field('promotion', 'Promotion', 'pair-lookup'),\n      field('mealPlan', 'Meal Plan', 'pair-readonly', true), field('resortFee', 'Resort Fee', 'pair-readonly'),\n      field('market', 'Market Segment', 'pair-readonly', true), field('track', 'Track / Sub Segment', 'pair-lookup', true),\n      field('confidentialRate', 'Confidential Rate', 'checkbox'), field('assignedRoom', 'Room', 'pair-lookup'),\n      field('doNotMove', 'Do Not Move', 'checkbox'), field('doNotMoveReason', 'Do Not Move Reason', 'text'),\n      field('scheduledRoom', 'Scheduled Room', 'pair-readonly'), field('averageRate', 'Average Rate', 'computed-pair', true),\n      field('totalRate', 'Total Rate', 'computed-pair', true), field('addOnTotal', 'Add-On Total', 'computed-pair', true),\n      field('grandTotal', 'Grand Total', 'computed-pair', true), field('waitlistPriority', 'Waitlist Priority', 'readonly'),\n      field('bookerName', 'Booker Name', 'text'), field('bookerContact', 'Booker Contact', 'text'),\n      field('authorisedBy', 'Authorised by', 'text'),\n    ];\n    const GUEST = [\n      field('profileId', 'Profile ID', 'pair-readonly'), field('title', 'Title', 'pair-select', false, ['', 'Mr', 'Ms', 'Mx']),\n      field('lastName', 'Last Name', 'pair-name-lookup', false, [], { required: true }), field('firstName', 'First Name', 'pair-text', false, [], { required: true }),\n      field('vip', 'VIP Level', 'pair-select', false, ['', 'Example VIP']), field('gender', 'Gender', 'pair-select', false, ['', 'Example selection']),\n      field('phoneType', 'Phone Type', 'pair-select', false, ['', 'Primary', 'Other']), field('phoneNumber', 'Phone Number', 'pair-text'),\n      field('mobileNumber', 'Mobile Number', 'pair-text'), field('emailType', 'E-mail Type', 'pair-select', false, ['', 'Primary', 'Other']),\n      field('emailAddress', 'E-mail Address', 'pair-email'), field('autoEmailFolio', 'Auto Email Folio', 'pair-checkbox'),\n      field('legacyMarketing', 'Legacy Marketing Opt in', 'pair-checkbox'), field('lifestyleMarketing', 'Lifestyle Marketing Opt in', 'pair-checkbox'),\n      field('legacyMember', 'Legacy Lifestyle Member', 'pair-checkbox'), field('terms', 'Terms and Conditions', 'pair-checkbox'),\n      field('language', 'Language', 'pair-select', false, ['', 'English \u00b7 sample']), field('passportReference', 'Scanned Passport Reference', 'pair-readonly'),\n      field('passportDate', 'Passport Scan Date', 'pair-date'), field('addressType', 'Address Type', 'pair-select', false, ['', 'Billing \u00b7 sample', 'Home \u00b7 sample']),\n      field('address', 'Address', 'pair-textarea'), field('city', 'City', 'pair-text'), field('postalCode', 'Postal Code', 'pair-lookup'),\n      field('country', 'Country', 'pair-lookup'), field('province', 'State / Province', 'pair-lookup'), field('nationality', 'Nationality', 'pair-lookup'),\n      field('residence', 'Country of Residence', 'pair-lookup'), field('vat', 'VAT Id', 'pair-text'), field('vehicle', 'Vehicle Reg No.', 'pair-text'),\n      field('birthDate', 'Date of Birth', 'pair-date'), field('turndown', 'Turndown Time', 'pair-select', false, ['', 'Example time']),\n      field('cleaning', 'Cleaning Time', 'pair-select', false, ['', 'Example time']),\n    ];\n    const SETTLEMENT = [field('settlementType', 'Settlement Type', 'lookup'), field('noPost', 'No Post', 'checkbox')];\n    const RESERVATION = [\n      field('flags', 'Flags', 'text'), field('status', 'Status', 'status', true), field('confirmation', 'Confirmation Number', 'confirmation', true),\n      field('externalReference', 'External Reference 1', 'text'), field('agencyContract', 'Booking Agency Contract', 'readonly'),\n      field('wifiVoucher', 'Wi-Fi Voucher', 'lookup'), field('wifiStatus', 'WIFI Status', 'readonly'),\n      field('group', 'Group', 'lookup'), field('individualGroup', 'Ind. Group', 'lookup'), field('depositDueAmount', 'Deposit Due Amount Required', 'readonly'),\n      field('depositDueDate', 'Deposit Due Date', 'date'), field('depositReceived', 'Deposit Received', 'readonly'), field('balance', 'Balance', 'readonly'),\n      field('lastProperty', 'Last Property', 'readonly'), field('lastRoom', 'Last Room Occupied', 'readonly'), field('lastCheckout', 'Last Checkout Date', 'readonly'),\n      field('reservationSettlementType', 'Settlement Type', 'lookup'),\n      field('cmsFormStatus', 'CMS Form Status', 'readonly'), field('cmsSend', 'CMS Send Mail', 'checkbox', true),\n      field('cmsMessage', 'CMS Message Id', 'lookup', true), field('cmsEmail', 'CMS Booker Email', 'email', true),\n      field('lifetimeRevenue', 'Lifetime Revenue', 'readonly'), field('lifetimeNights', 'Lifetime Nights', 'readonly'),\n      field('lifetimeStays', 'Lifetime Stays', 'readonly'), field('loyalty', 'Loyalty Number', 'readonly'), field('legacyPoints', 'Legacy Points Balance', 'readonly'),\n      field('legacyLifestyleUpdate', 'Legacy Lifestyle Update', 'checkbox'), field('newExistingMember', 'New / Existing Member', 'checkbox'),\n    ];\n    const ADDON = [field('addOn', 'Hotel Add-On', 'lookup', true), field('addOnDate', 'Date', 'date', true),\n      field('addOnTime', 'Arrival Time', 'time', true), field('addOnRoom', 'Attach to', 'select', true, ['queen', 'twin']),\n      field('addOnQuantity', 'Trips', 'number', true)];\n    function isVisible(item, expanded) {\n      if (expanded || item.always || item.required) return true;\n      const value = state.values[item.key];\n      return value && typeof value === 'object' ? rooms.some((room) => filled(value[room])) : filled(value);\n    }\n    function valueFor(item, room) {\n      const p = prices();\n      if (item.kind === 'band') return String(childBands(room)[item.band]);\n      if (item.key === 'averageRate') return p.dates.length ? money(p.totals[room] / p.dates.length) : '\u2014';\n      if (item.key === 'totalRate') return p.dates.length ? money(p.totals[room]) : '\u2014';\n      if (item.key === 'addOnTotal') return money(room === state.values.addOnRoom ? p.addOn : 0);\n      if (item.key === 'grandTotal') return money(p.totals[room] + (room === state.values.addOnRoom ? p.addOn : 0));\n      if (item.key === 'status') return state.scenario === 'uncertain' && room === 'twin' ? 'Uncertain \u00b7 check HMS' : state.scenario === 'partial' && state.values.addOn === 'None' && room === 'twin' ? 'Not saved \u00b7 needs attention' : hasOutcome() ? 'Confirmed \u00b7 example' : 'New \u00b7 not yet saved';\n      if (item.key === 'confirmation') return state.scenario === 'uncertain' && room === 'twin' ? 'May exist \u00b7 check HMS' : state.scenario === 'partial' && state.values.addOn === 'None' && room === 'twin' ? 'Not assigned' : hasOutcome() ? (room === 'queen' ? 'SIM-Q-1042' : 'SIM-T-1043') : 'Not assigned';\n      const value = state.values[item.key];\n      return room ? value?.[room] ?? '' : value ?? '';\n    }\n    function control(item, room) {\n      const value = valueFor(item, room);\n      const id = `field-${item.key}${room ? '-' + room : ''}`;\n      const key = item.key + (room ? '.' + room : '');\n      const data = `data-field=\"${esc(item.key)}\"${room ? ` data-room=\"${room}\"` : ''}`;\n      const disabled = hasOutcome() || (item.key === 'cmsSend' && state.cmsMode === 'unverified') ? ' disabled' : '';\n      let html;\n      if (item.kind.includes('lookup')) html = `\u003cdiv class=\"lookup-entry\">\u003cinput id=\"${id}\" ${data} ${item.kind === 'pair-name-lookup' ? '' : 'data-lookup-input'} type=\"text\" value=\"${esc(value)}\" placeholder=\"Search HMS\u2026\" aria-label=\"${esc(item.label)}${room ? ' \u00b7 ' + esc(roomLabel(room)) : ''}\"${disabled}>\u003cbutton type=\"button\" data-lookup=\"${esc(item.key)}\"${room ? ` data-room=\"${room}\"` : ''} aria-label=\"Search ${esc(item.label)}${room ? ' \u00b7 ' + esc(roomLabel(room)) : ''}\"${disabled}>\u003cspan class=\"lookup-icon\" aria-hidden=\"true\">\u2315\u003c/span>\u003c/button>\u003c/div>`;\n      else if (item.kind.includes('checkbox')) html = `\u003clabel class=\"checkbox\">\u003cinput id=\"${id}\" ${data} type=\"checkbox\" aria-label=\"${esc(item.label)}${room ? ' \u00b7 ' + esc(roomLabel(room)) : ''}\"${value && !(item.key === 'cmsSend' && state.cmsMode === 'unverified') ? ' checked' : ''}${disabled}>${room ? '' : ' ' + esc(item.label)}\u003c/label>`;\n      else if (item.kind.includes('select')) html = `\u003cselect id=\"${id}\" ${data}${disabled}>${item.options.map((option) => `\u003coption value=\"${esc(option)}\"${String(option) === String(value) ? ' selected' : ''}>${esc(item.key === 'addOnRoom' ? roomLabel(option) : option || 'Select\u2026')}\u003c/option>`).join('')}\u003c/select>`;\n      else if (item.kind.includes('textarea')) html = `\u003ctextarea id=\"${id}\" ${data}${disabled}>${esc(value)}\u003c/textarea>`;\n      else {\n        const readOnly = ['readonly', 'pair-readonly', 'band', 'computed', 'computed-pair', 'status', 'confirmation'].includes(item.kind);\n        const type = item.kind.includes('date') ? 'date' : item.kind.includes('email') ? 'email' : item.kind === 'number' ? 'number' : item.kind === 'time' ? 'time' : 'text';\n        html = `\u003cinput id=\"${id}\" ${data} type=\"${type}\" value=\"${esc(value)}\"${readOnly ? ' readonly' : disabled}>`;\n      }\n      const conflict = Object.hasOwn(state.conflicts, key) ? `\u003cdiv class=\"field-help conflict\">New suggestion: ${esc(state.conflicts[key] || 'empty')} \u00b7 your edit was kept.\u003c/div>` : '';\n      const unbound = state.unbound[key] ? '\u003cdiv class=\"field-help conflict\">Select a matching example from the lookup.\u003c/div>' : '';\n      const fullValue = room && item.kind === 'pair-lookup' && String(value).length > 13 ? `\u003cdiv class=\"field-help\">${esc(value)}\u003c/div>` : '';\n      return `${html}${fullValue}${conflict}${unbound}`;\n    }\n    function childrenField() {\n      const counts = rooms.map((room) => `\u003cdiv>\u003cspan class=\"pair-caption\">${esc(roomLabel(room))}\u003c/span>\u003cinput readonly value=\"${state.children[room].length}\">\u003c/div>`).join('');\n      const editors = state.childEditor ? `\u003cdiv class=\"child-edit\">${rooms.map((room) => `\u003cdiv>\u003cstrong>${esc(roomLabel(room))}\u003c/strong>\u003cdiv class=\"field-help\">Number of children\u003c/div>\u003cinput type=\"number\" min=\"0\" max=\"4\" data-child-count=\"${room}\" value=\"${state.children[room].length}\"${hasOutcome() ? ' disabled' : ''}>${state.children[room].map((child, index) => `\u003cdiv class=\"child-grid\">\u003cdiv class=\"field\">\u003clabel class=\"field-label\">Child name\u003c/label>\u003cinput data-child-room=\"${room}\" data-child-index=\"${index}\" data-child-part=\"name\" value=\"${esc(child.name)}\"${hasOutcome() ? ' disabled' : ''}>\u003c/div>\u003cdiv class=\"field\">\u003clabel class=\"field-label\">           const rows = [
            ...(includeContact ? [['Contact', contact.name], ['Contact email', contact.email], ['Contact phone', contact.phone], ['Company / agency', legacy.company], ['Billing', legacy.billing]] : []),
            ['HMS profile', legacy.companyHms], ['Rate context', legacy.rate],
          ].filter(([, value]) => typeof value === 'string' && value);
          if (!rows.length) return null;
          const card = section('People and billing');
          const grid = element('div', 'field-stack');
          for (const [label, value] of rows) grid.append(field(label, value, { readOnly: true }).wrap);
          card.append(grid);
          return card;
        }

        function buildTwoRoomBooking(item) {
          const view = element('section', 'workflow-view');
          view.dataset.workflowView = 'booking';
          const title = element('div', 'workflow-title');
          title.append(heading('Booking review', 'h1'), element('span', 'tag tag-green', 'Draft'));
          view.append(title);
          const frame = document.createElement('iframe');
          frame.title = 'Two-room booking review';
          frame.style.cssText = 'display:block;width:100%;height:1000px;border:0;overflow:hidden';
          frame.srcdoc = TWO_ROOM_HTML.replace('<body>', '<body class="embed-review">');
          twoRoomFrame = frame;
          frame.addEventListener('load', () => {
            for (const [selector, type] of [['[data-two-scenario]', 'nava-demo-scenario'], ['[data-two-cms]', 'nava-demo-cms']]) {
              const control = root.querySelector(selector);
              frame.contentWindow.postMessage({ type, value: control.value }, '*');
            }
          });
          view.append(frame);
          return view;
        }
        function buildBooking(item) {
          if (item.twoRoomDemo) return buildTwoRoomBooking(item);
          const view = element('section', 'workflow-view');
          view.dataset.workflowView = 'booking';
          const title = element('div', 'workflow-title');
          title.append(heading('Booking review', 'h1'), element('span', 'tag tag-green', 'Draft'));
          view.append(title);
          const result = section('Booking outcome');
          result.hidden = true;
          function showResult() {
            result.hidden = false;
            result.replaceChildren(heading('Booking outcome'),
              element('div', 'assumption', 'Example only: no HMS booking or email was created.'),
              element('div', 'small muted', 'Room · simulated result'),
              element('div', 'small muted', 'HMS confirmation · not sent'));
          }
          if (readState(item).bookingSimulationComplete) showResult();
          view.append(result);
          const groups = element('div', 'booking-groups');
          FIELD_GROUPS.forEach((group, groupIndex) => {
            const card = element('section', 'booking-group');
            const head = element('div', 'booking-group-head');
            head.append(element('strong', '', group.title));
            const toggle = makeButton('Show all fields', 'booking-toggle');
            head.append(toggle); card.append(head);
            const fields = element('div', 'booking-fields');
            const nodes = group.fields.map((label, fieldIndex) => ({ label, node: addBookingField(label, groupIndex, fieldIndex, item) }));
            nodes.forEach(({node}) => fields.append(node));
            let expanded = Boolean(readState(item).expandedBookingGroups?.[group.title]);
            function visibleValue(node) {
              return [...node.querySelectorAll('input,select,textarea')].some((control) =>
                control.type === 'checkbox' ? control.checked : String(control.value || '').trim() !== '');
            }
            function update() {
              let hidden = 0;
              for (const {label,node} of nodes) {
                const keep = ALWAYS_BOOKING_FIELDS.has(label) || visibleValue(node) || node.contains(document.activeElement);
                node.hidden = !expanded && !keep;
                if (!keep) hidden++;
              }
              toggle.textContent = expanded ? 'Hide empty fields' : `Show all fields (${hidden} empty)`;
            }
            toggle.addEventListener('click', () => {
              expanded = !expanded;
              saveState({ expandedBookingGroups: { ...(readState(item).expandedBookingGroups || {}), [group.title]: expanded } }, item);
              update();
            });
            fields.addEventListener('input', update);
            fields.addEventListener('change', update);
            fields.addEventListener('focusout', () => setTimeout(update, 0));
            card.append(fields); groups.append(card); update();
          });
          view.append(groups);
          const confirmation = section('HMS confirmation');
          confirmation.append(element('div', 'small muted', 'The CMS fields above show the proposed choice and recipient. Combined confirmation support and send permission are not verified in this demo.'));
          view.append(confirmation);
          const footer = section('Review booking');
          footer.append(element('div', 'small muted', 'One example approval covers the booking details above. No HMS connection or email is used.'));
          const approve = makeButton('Approve & create provisional booking', 'primary-button full-width', { dataset: { simulatedAction: 'booking' } });
          approve.addEventListener('click', () => { showResult(); saveState({ bookingSimulationComplete: true }, item); setStatus('Example only: no HMS request or email was sent.', 'success'); result.scrollIntoView({block:'nearest'}); });
          footer.append(approve); view.append(footer);
          appendEditableReply(view, item, 'booking');
          childAgeDialog(item, view);
          return view;
        }
        function buildAmendment(item) {
          const view = element('section', 'workflow-view');
          view.dataset.workflowView = 'amendment';
          const title = element('div', 'workflow-title');
          title.append(heading('Amendment review', 'h1'), element('span', 'tag tag-amber', 'Proposed only'));
          view.append(title);
          const legacy = getLegacy(item);
          const context = legacyPartyContext(item, true);
          if (context) view.append(context);
          const rawStay = item.existingStay ?? legacy.existingStay ?? legacy.found;
          const stay = Array.isArray(rawStay) ? rawStay[0] || {} : rawStay || {};
          const found = section('Matched existing stay');
          const rows = [
            ['Confirmation', stay.confirmation || stay.confirmationNumber || stay.conf], ['Guest', stay.guestName || stay.guest],
            ['Arrival', stay.arrivalDate || stay.arrival], ['Departure', stay.departureDate || stay.departure],
            ['Room type', stay.roomType || stay.type], ['Occupancy', stay.pax || stay.adults], ['Board', stay.board], ['Status', stay.status],
          ];
          const grid = element('div', 'field-grid');
          for (const [label, value] of rows) {
            const itemField = field(label, text(value), { readOnly: true });
            grid.append(itemField.wrap);
          }
          found.append(grid);
          if (stay.confirmation || stay.confirmationNumber) {
            const copy = makeButton('Copy confirmation', 'secondary-button', { dataset: { simulatedAction: 'copy-confirmation' } });
            copy.addEventListener('click', () => setStatus('Nothing was copied. Clipboard unchanged.', 'success'));
            found.append(copy);
          }
          view.append(found);
          const changes = section('Requested changes · compare before action');
          const rawChanges = item.requestedChanges ?? legacy.requestedChanges;
          const changeList = list(rawChanges).map((change) => {
            if (Array.isArray(change) && change.length >= 3) return { field: change[0], before: change[1], after: change[2] };
            if (change && typeof change === 'object') return {
              field: change.field ?? change.label,
              before: change.before ?? change.prior,
              after: change.after ?? change.requested,
              status: change.status,
            };
            return null;
          }).filter((change) => change && change.before !== change.after);
          if (!changeList.length) changes.append(element('div', 'empty-state', 'No changed fields remain after removing unchanged rows.'));
          for (const change of changeList) {
            const row = element('div', 'change-row');
            row.dataset.amendmentChange = 'true';
            row.append(element('strong', '', text(change.field || 'Requested field')));
            const cols = element('div', 'two-col');
            cols.append(element('div', 'small muted', `HMS: ${text(change.before) || 'Not available'}`));
            cols.append(element('div', 'small', `Requested: ${text(change.after) || 'Not available'}`));
            row.append(cols, element('span', 'tag', text(change.status || 'Needs review')));
            changes.append(row);
          }
          view.append(changes);
          const actions = section('Human review');
          actions.append(element('div', 'small muted', 'No live HMS connection. A staff member would review and approve any change outside this prototype.'));
          const actionRow = element('div', 'pane-actions');
          const preview = makeButton('Preview amendment', 'secondary-button', { dataset: { simulatedAction: 'amend-preview' } });
          const run = makeButton('Run amendment in HMS', 'primary-button', { dataset: { simulatedAction: 'amend' } });
          for (const button of [preview, run]) button.addEventListener('click', () => setStatus(`${button.textContent}: no HMS request or update occurred.`, 'success'));
          actionRow.append(preview, run);
          actions.append(actionRow);
          view.append(actions);
          appendEditableReply(view, item, 'amendment');
          return view;
        }
        function buildCancellation(item) {
          const view = element('section', 'workflow-view');
          view.dataset.workflowView = 'cancellation';
          const title = element('div', 'workflow-title');
          title.append(heading('Cancellation review', 'h1'), element('span', 'tag tag-amber', 'No cancellation action'));
          view.append(title);
          const legacy = getLegacy(item);
          const context = legacyPartyContext(item, true);
          if (context) view.append(context);
          const matches = section('Possible existing stays');
          const rows = list(item.matches ?? legacy.matches ?? legacy.found);
          if (!rows.length) matches.append(element('div', 'empty-state', 'No matched stay was provided. Do not choose a guest by guess.'));
          for (const match of rows) {
            const row = element('div', 'match-row');
            row.dataset.cancellationMatch = 'true';
            row.append(element('strong', '', `${text(match.confirmation || match.confirmationNumber || match.conf)} · ${text(match.guestName || match.guest)}`));
            const dates = [match.arrivalDate || match.arrival, match.departureDate || match.departure].filter(Boolean).map(text).join(' – ');
            const details = [
              dates,
              match.roomType || match.type ? `Room type · ${text(match.roomType || match.type)}` : '',
              match.pax != null ? `Pax · ${text(match.pax)}` : '',
              match.board != null ? `Board · ${text(match.board)}` : '',
            ].filter(Boolean).join(' · ');
            if (details) row.append(element('div', 'small muted', details));
            row.append(element('span', 'tag', text(match.status || 'Existing stay')));
            matches.append(row);
          }
          view.append(matches);
          const historyRows = list(item.history ?? legacy.history);
          if (historyRows.length) {
            const history = section('Booking history · not a match list');
            for (const entry of historyRows) {
              const row = element('div', 'match-row', Array.isArray(entry) ? entry.map(text).filter(Boolean).join(' · ') : text(entry));
              row.dataset.cancellationHistoryRow = 'true';
              history.append(row);
            }
            view.append(history);
          }
          const policy = item.policyPreview || legacy.policyPreview || legacy.policy || {};
          const policyCard = section('Policy preview · example only');
          const policyText = element('div', 'assumption', text(policy.text || policy.status || 'Policy needs staff review. No penalty is accepted in this prototype.'));
          policyText.dataset.policyText = 'true';
          policyCard.append(policyText);
          for (const [key, label] of [['received', 'Received'], ['arrival', 'Arrival'], ['hours', 'Hours until arrival']]) {
            if (policy[key] == null || policy[key] === '') continue;
            const line = element('div', 'small muted', `${label} · example: ${text(policy[key])}`);
            if (key === 'hours') line.dataset.policyHours = 'true';
            policyCard.append(line);
          }
          const fee = policy.fee ?? policy.penaltyExample;
          if (fee != null && fee !== '') policyCard.append(element('div', 'output-total', `Fee example · not applied: ${text(fee)}`));
          if (policy.action) policyCard.append(element('div', 'small muted', text(policy.action)));
          const preview = makeButton('Preview cancellation policy', 'secondary-button full-width', { dataset: { simulatedAction: 'cancel-preview' } });
          preview.addEventListener('click', () => setStatus('Cancellation policy preview only. No cancellation or penalty was accepted.', 'warning'));
          policyCard.append(preview);
          view.append(policyCard);
          const refusal = section('Staff control');
          refusal.append(element('div', 'small muted', 'Cancellation penalty dialogs are never accepted. There is no cancel or commit control here.'));
          view.append(refusal);
          appendEditableReply(view, item, 'cancellation');
          return view;
        }
        function buildOther() {
          const view = element('section', 'workflow-view');
          view.dataset.workflowView = 'other';
          view.append(heading('Review email', 'h1'));
          view.append(element('div', 'empty-state', 'Choose a read-as label above. No workflow action has run.'));
          return view;
        }
        function baselineReviewValue(item, bucket, index) {
          try {
            const stored = JSON.parse(localStorage.getItem('navaPaneDemo') || '{}');
            if (!stored || typeof stored !== 'object' || Array.isArray(stored)) return undefined;
            const hash = text(item.hash || item.id);
            const candidates = [hash, hash.replace(/^#/, ''), item.id].filter(Boolean);
            const caseKey = candidates.find((key) => Object.hasOwn(stored, key)
              && stored[key] && typeof stored[key] === 'object' && !Array.isArray(stored[key]));
            const values = caseKey ? stored[caseKey][bucket] : null;
            if (values && typeof values === 'object' && Object.hasOwn(values, String(index))) return values[String(index)];
          } catch { /* existing review storage may be unavailable or malformed */ }
          return undefined;
        }
        function reviewDraftValue(item, index, fieldName, fallback) {
          const key = `review-${fieldName}-${index}`;
          const fields = readState(item).fields || {};
          if (Object.hasOwn(fields, key)) return text(fields[key]);
          const baseline = baselineReviewValue(item, fieldName === 'answer' ? 'a' : 'n', index);
          return baseline === undefined ? text(fallback) : text(baseline);
        }
        function renderReview(item, parent) {
          const questions = list(item.review?.questions);
          const area = element('section', 'qs');
          area.append(element('h2', '', 'Questions for the reservations team'));
          area.append(element('p', 'l', 'Each card is a choice Nava made for this email. Pick the answer you would give.'));
          questions.forEach((question, index) => {
            const row = element('div', 'q');
            row.dataset.reviewQuestion = 'true';
            if (question.label) row.append(element('div', 'd', text(question.label)));
            if (question.context) row.append(element('div', 'y', text(question.context)));
            const prompt = element('div', 'a');
            prompt.append(element('b', '', 'Question: '), document.createTextNode(text(question.prompt ?? question.question ?? '')));
            row.append(prompt);
            const savedAnswer = reviewDraftValue(item, index, 'answer', question.answer ?? '');
            const answer = document.createElement('select');
            answer.dataset.reviewAnswer = String(index);
            answer.setAttribute('aria-hidden', 'true');
            answer.tabIndex = -1;
            const blank = element('option', '', 'Select an answer'); blank.value = ''; answer.append(blank);
            const options = list(question.options);
            for (const option of options) { const choice = element('option', '', option); choice.value = text(option); answer.append(choice); }
            if (savedAnswer && !options.some((option) => text(option) === savedAnswer)) { const saved = element('option', '', savedAnswer); saved.value = savedAnswer; answer.append(saved); }
            answer.value = savedAnswer;
            addStateInput(answer, `review-answer-${index}`, item);
            const choices = element('div', 'o');
            for (const option of options) {
              const button = makeButton(text(option), '', { 'aria-pressed': String(text(option) === answer.value) });
              button.addEventListener('click', () => {
                answer.value = text(option); answer.dispatchEvent(new Event('change', { bubbles: true }));
                for (const candidate of choices.querySelectorAll('button')) candidate.setAttribute('aria-pressed', String(candidate === button));
              });
              choices.append(button);
            }
            row.append(answer, choices);
            const comment = document.createElement('textarea');
            comment.dataset.reviewComment = String(index);
            comment.setAttribute('aria-label', 'Saved comment');
            comment.placeholder = 'Comment (optional)';
            comment.value = reviewDraftValue(item, index, 'comment', question.comment ?? '');
            addStateInput(comment, `review-comment-${index}`, item);
            row.append(comment);
            area.append(row);
          });
          if (questions.length) parent.append(area);
        }
        function renderWorkflow(item) {
          twoRoomFrame = null;
          app.paneContent.replaceChildren();
          const selectedReadAs = app.readAs.value;
          const builder = selectedReadAs === 'quote' ? buildQuote
            : selectedReadAs === 'booking' ? buildBooking
              : selectedReadAs === 'amendment' ? buildAmendment
                : selectedReadAs === 'cancellation' ? buildCancellation : buildOther;
          const view = builder(item);
          app.paneContent.append(view);
          app.reviewContainer.replaceChildren();
          renderReview(item, app.reviewContainer);
        }

        app.readAs.addEventListener('change', () => {
          saveState({ readAs: app.readAs.value });
          renderWorkflow(activeCase);
          setStatus(`Read as ${app.readAs.options[app.readAs.selectedIndex].text}; local edit only.`, 'success');
        });
        root.querySelector('[data-simulate-gold]').addEventListener('click', () => {
          setStatus('No gold label was saved. Existing review storage was not changed.', 'success');
        });
        root.querySelector('[data-reset-demo-case]').addEventListener('click', () => {
          try { sessionStorage.removeItem(stateKey()); } catch { /* tab storage may be unavailable */ }
          selectCase(activeCase);
          setStatus('This case’s local pane edits were reset. Other cases and existing review storage were left alone.', 'success');
        });
        window.addEventListener('hashchange', () => selectCase(caseForHash(currentCaseId())));
        addCaseLinks();
        selectCase(caseForHash(currentCaseId()));
      })();
    </script>
  </body>
</html>
