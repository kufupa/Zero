<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background Gradient Gallery</title>
  <style>
    :root {
      --teal-edge: #113f3f;
      --teal: #13454c;
      --blue: #35598d;
      --blue-lift: #41699a;
      --indigo: #6a5bb1;
      --violet: #986bcd;
      --magenta: #a566d1;
      --magenta-lift: #ac6ed7;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #0c252a; }
    body { margin: 0; min-width: 0; font: 13px/1.4 system-ui, sans-serif; color: #d9e1e5; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(22px, 2.2vw, 34px);
      width: min(100%, 1720px);
      margin: 0 auto;
      padding: clamp(20px, 3.6vw, 58px);
    }

    figure { margin: 0; min-width: 0; }
    figcaption { margin-top: 10px; letter-spacing: 0.015em; }

    /* Every treatment inherits the same sampled field and bloom positions. */
    .swatch {
      position: relative;
      isolation: isolate;
      container-type: inline-size;
      min-width: 0;
      aspect-ratio: 722 / 334;
      overflow: hidden;
      border-radius: 10px;
      background:
        radial-gradient(ellipse 78% 108% at 45% 45%, transparent 42%, color-mix(in srgb, var(--teal-edge) 76%, transparent) 100%),
        radial-gradient(ellipse 29% 76% at 46% 8%, var(--violet) 0%, color-mix(in srgb, var(--violet) 80%, transparent) 36%, transparent 100%),
        radial-gradient(ellipse 28% 65% at 0% 88%, var(--magenta-lift) 0%, color-mix(in srgb, var(--magenta) 90%, transparent) 30%, transparent 100%),
        radial-gradient(ellipse 36% 73% at 48% 100%, var(--blue-lift) 0%, color-mix(in srgb, var(--blue) 70%, transparent) 55%, transparent 100%),
        radial-gradient(ellipse 35% 56% at 45% 62%, color-mix(in srgb, var(--indigo) 68%, transparent), transparent 100%),
        linear-gradient(135deg, var(--teal), var(--teal-edge));
    }

    .swatch::before,
    .swatch::after { content: ""; position: absolute; inset: 0; pointer-events: none; }

    .arc-bands::before {
      background: radial-gradient(ellipse 74% 150% at 50% 125%,
        transparent 0% 26%, color-mix(in srgb, var(--violet) 35%, transparent) 26.5% 38%,
        color-mix(in srgb, var(--blue-lift) 30%, transparent) 38.5% 50%, color-mix(in srgb, var(--magenta) 27%, transparent) 50.5% 62%,
        color-mix(in srgb, var(--teal) 35%, transparent) 62.5% 74%, transparent 74.5%);
    }

    .aurora::before {
      background:
        radial-gradient(ellipse 12% 90% at 34% 14%, color-mix(in srgb, var(--violet) 46%, transparent) 25%, transparent 90%),
        radial-gradient(ellipse 13% 80% at 55% 57%, color-mix(in srgb, var(--blue-lift) 52%, transparent) 20%, transparent 90%),
        radial-gradient(ellipse 14% 70% at 14% 90%, color-mix(in srgb, var(--magenta) 44%, transparent) 25%, transparent 90%);
      transform: skewX(-23deg);
      filter: blur(5px);
    }

    .cherry-petal::before {
      inset: auto;
      width: 5%; height: 15%; left: 12%; top: 29%;
      border-radius: 85% 16% 76% 23%;
      background: color-mix(in srgb, var(--violet) 38%, transparent);
      box-shadow: 18cqw -4cqw 1px color-mix(in srgb, var(--blue-lift) 42%, transparent),
        39cqw 5cqw 1px color-mix(in srgb, var(--violet) 40%, transparent), 63cqw 8cqw 1px color-mix(in srgb, var(--teal) 55%, transparent),
        8cqw 17cqw 1px color-mix(in srgb, var(--magenta-lift) 45%, transparent), 31cqw 24cqw 1px color-mix(in srgb, var(--indigo) 44%, transparent),
        54cqw 30cqw 1px color-mix(in srgb, var(--blue-lift) 42%, transparent);
      transform: rotate(-27deg);
    }

    .coral-glow::before {
      background:
        radial-gradient(ellipse 19% 39% at 33% 18%, color-mix(in srgb, var(--violet) 42%, transparent) 32%, transparent),
        radial-gradient(ellipse 17% 35% at 59% 35%, color-mix(in srgb, var(--indigo) 45%, transparent) 32%, transparent),
        radial-gradient(ellipse 19% 39% at 11% 82%, color-mix(in srgb, var(--magenta) 44%, transparent) 32%, transparent),
        radial-gradient(ellipse 20% 41% at 44% 87%, color-mix(in srgb, var(--blue-lift) 48%, transparent) 32%, transparent);
    }

    .dark-arc-bands::before {
      background: radial-gradient(ellipse 78% 164% at 50% 130%,
        transparent 0% 28%, color-mix(in srgb, var(--teal-edge) 34%, transparent) 28.5% 39%,
        color-mix(in srgb, var(--indigo) 23%, transparent) 39.5% 50%, color-mix(in srgb, var(--teal-edge) 32%, transparent) 50.5% 61%,
        color-mix(in srgb, var(--blue) 25%, transparent) 61.5% 72%, transparent 72.5%);
    }

    .dark-aurora::before {
      background:
        radial-gradient(ellipse 10% 95% at 34% 30%, color-mix(in srgb, var(--teal-edge) 54%, transparent) 35%, transparent 90%),
        radial-gradient(ellipse 12% 88% at 54% 52%, color-mix(in srgb, var(--indigo) 34%, transparent) 30%, transparent 95%),
        radial-gradient(ellipse 10% 85% at 18% 85%, color-mix(in srgb, var(--magenta) 27%, transparent) 20%, transparent 90%);
      transform: skewX(25deg);
      filter: blur(13px);
    }

    .dark-carbon-spotlight::before {
      background:
        radial-gradient(ellipse 30% 115% at 46% -22%, color-mix(in srgb, var(--violet) 44%, transparent) 30%, transparent 90%),
        radial-gradient(ellipse 50% 76% at 46% 25%, transparent 18%, color-mix(in srgb, var(--teal-edge) 72%, transparent) 100%);
    }

    .dark-ember::before {
      background:
        radial-gradient(ellipse 10% 21% at 47% 16%, color-mix(in srgb, var(--violet) 40%, transparent) 34%, transparent),
        radial-gradient(ellipse 11% 23% at 9% 79%, color-mix(in srgb, var(--magenta) 36%, transparent) 34%, transparent),
        radial-gradient(ellipse 12% 25% at 41% 88%, color-mix(in srgb, var(--blue-lift) 42%, transparent) 34%, transparent),
        radial-gradient(ellipse 16% 33% at 77% 74%, color-mix(in srgb, var(--teal-edge) 62%, transparent) 34%, transparent);
    }

    .dark-ink-field::before {
      inset: 9% 39% 16% 20%;
      border-radius: 41% 59% 28% 72% / 65% 31% 69% 35%;
      background: color-mix(in srgb, var(--teal-edge) 35%, transparent);
      filter: blur(12px);
      transform: rotate(-19deg);
      box-shadow: -29cqw 25cqw 15px color-mix(in srgb, var(--magenta) 23%, transparent), 23cqw 20cqw 17px color-mix(in srgb, var(--blue) 25%, transparent);
    }

    .dark-midnight-mesh::before {
      background:
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--teal-edge) 27%, transparent) 0 1px, transparent 1px 15px),
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--blue-lift) 22%, transparent) 0 1px, transparent 1px 15px),
        radial-gradient(ellipse at 50% 45%, transparent 28%, color-mix(in srgb, var(--teal-edge) 40%, transparent) 100%);
    }

    .dark-rose-noir::before {
      background:
        radial-gradient(ellipse 21% 43% at 39% 13%, color-mix(in srgb, var(--magenta) 43%, transparent) 40%, transparent),
        radial-gradient(ellipse 25% 55% at 5% 87%, color-mix(in srgb, var(--magenta-lift) 46%, transparent) 38%, transparent),
        radial-gradient(ellipse at 42% 43%, transparent 30%, color-mix(in srgb, var(--teal-edge) 44%, transparent) 100%);
    }

    .dark-teal-depth::before {
      background:
        radial-gradient(ellipse 44% 76% at 105% 17%, color-mix(in srgb, var(--teal) 72%, transparent) 55%, transparent 95%),
        radial-gradient(ellipse 35% 58% at 79% 114%, color-mix(in srgb, var(--teal-edge) 64%, transparent) 50%, transparent 95%),
        radial-gradient(ellipse 19% 45% at 15% 15%, color-mix(in srgb, var(--teal) 42%, transparent) 35%, transparent 95%);
    }

    .frost-mesh::before {
      background:
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--violet) 23%, transparent) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--blue-lift) 28%, transparent) 0 1px, transparent 1px 12px),
        radial-gradient(ellipse at 0% 100%, color-mix(in srgb, var(--magenta-lift) 18%, transparent), transparent 50%);
    }

    .halftone-pop::before {
      background:
        radial-gradient(ellipse at 43% 12%, var(--violet), transparent 70%),
        radial-gradient(ellipse at 6% 88%, var(--magenta-lift), transparent 65%),
        radial-gradient(ellipse at 48% 95%, var(--blue-lift), transparent 65%);
      mask-image: radial-gradient(circle, var(--teal-edge) 0 1px, transparent 1.3px);
      mask-size: 7px 7px;
      opacity: 0.42;
    }

    .honey-ember::before {
      background:
        radial-gradient(ellipse 13% 27% at 31% 9%, color-mix(in srgb, var(--violet) 46%, transparent) 35%, transparent),
        radial-gradient(ellipse 15% 31% at 54% 31%, color-mix(in srgb, var(--indigo) 48%, transparent) 35%, transparent),
        radial-gradient(ellipse 17% 35% at 10% 70%, color-mix(in srgb, var(--magenta-lift) 48%, transparent) 35%, transparent),
        radial-gradient(ellipse 17% 35% at 29% 100%, color-mix(in srgb, var(--magenta) 42%, transparent) 35%, transparent),
        radial-gradient(ellipse 20% 41% at 58% 89%, color-mix(in srgb, var(--blue-lift) 48%, transparent) 35%, transparent);
    }

    .ink-wash::before {
      inset: -10% 34% 32% 23%;
      border-radius: 37% 63% 71% 29% / 64% 29% 71% 36%;
      background: color-mix(in srgb, var(--violet) 25%, transparent);
      filter: blur(8px);
      transform: rotate(-16deg);
      box-shadow: -35cqw 28cqw 12px color-mix(in srgb, var(--magenta) 35%, transparent);
    }
    .ink-wash::after {
      inset: 58% 36% -23% 24%;
      border-radius: 65% 35% 27% 73% / 26% 63% 37% 74%;
      background: color-mix(in srgb, var(--blue-lift) 28%, transparent);
      filter: blur(10px);
      transform: rotate(12deg);
    }

    .linen-weave::before {
      background:
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--violet) 13%, transparent) 0 1px, color-mix(in srgb, var(--teal-edge) 12%, transparent) 1px 2px, transparent 2px 5px),
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--blue-lift) 15%, transparent) 0 1px, transparent 1px 5px);
    }

    .mint-lagoon::before {
      inset: -30% -10%;
      background:
        radial-gradient(ellipse 64% 10% at 45% 25%, color-mix(in srgb, var(--violet) 42%, transparent) 35%, transparent 95%),
        radial-gradient(ellipse 58% 11% at 24% 63%, color-mix(in srgb, var(--magenta) 44%, transparent) 35%, transparent 95%),
        radial-gradient(ellipse 55% 10% at 51% 82%, color-mix(in srgb, var(--blue-lift) 46%, transparent) 35%, transparent 95%);
      transform: rotate(-19deg);
      filter: blur(4px);
    }

    .paper-fold::before {
      background:
        linear-gradient(146deg, transparent 46%, color-mix(in srgb, var(--violet) 30%, transparent) 49.5%, color-mix(in srgb, var(--teal-edge) 52%, transparent) 50%, transparent 54%),
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--blue-lift) 13%, transparent) 0 1px, transparent 1px 16px),
        repeating-linear-gradient(90deg, color-mix(in srgb, var(--violet) 13%, transparent) 0 1px, transparent 1px 16px);
    }

    .rain-prism::before {
      background:
        repeating-linear-gradient(114deg, color-mix(in srgb, var(--blue-lift) 34%, transparent) 0 1px, transparent 1px 11px),
        linear-gradient(180deg, transparent 38%, color-mix(in srgb, var(--violet) 26%, transparent) 48%, color-mix(in srgb, var(--blue-lift) 30%, transparent) 58%, transparent 68%);
    }

    .sand-drift::before {
      background:
        radial-gradient(ellipse 82% 110% at 64% 159%, color-mix(in srgb, var(--blue) 32%, transparent) 0% 72%, transparent 72.5%),
        radial-gradient(ellipse 102% 110% at 17% 161%, color-mix(in srgb, var(--magenta) 25%, transparent) 0% 80%, transparent 80.5%),
        radial-gradient(ellipse 88% 120% at 52% 150%, color-mix(in srgb, var(--indigo) 27%, transparent) 0% 75%, transparent 75.5%);
    }
    .sand-drift::after {
      background:
        repeating-linear-gradient(23deg, color-mix(in srgb, var(--teal-edge) 24%, transparent) 0 0.5px, transparent 0.5px 3px),
        repeating-linear-gradient(113deg, color-mix(in srgb, var(--blue-lift) 18%, transparent) 0 0.5px, transparent 0.5px 4px);
      opacity: 0.6;
    }

    .soft-spotlight::before {
      background:
        radial-gradient(ellipse 61% 75% at 46% -18%, color-mix(in srgb, var(--violet) 36%, transparent) 28%, transparent 95%),
        radial-gradient(ellipse at 45% 43%, transparent 42%, color-mix(in srgb, var(--teal-edge) 24%, transparent) 100%);
    }

    .sunrise-horizon::before {
      background:
        radial-gradient(ellipse 31% 19% at 45% 79%, color-mix(in srgb, var(--blue-lift) 40%, transparent), transparent 95%),
        linear-gradient(180deg, transparent 52%, color-mix(in srgb, var(--indigo) 22%, transparent) 52.5% 63%, color-mix(in srgb, var(--blue) 24%, transparent) 63.5% 75%, transparent 75.5%);
    }
    .sunrise-horizon::after {
      background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--violet) 20%, transparent) 0 1px, transparent 1px 14px);
      mask-image: linear-gradient(transparent 34%, var(--teal-edge) 76%, transparent);
    }

    .sunset-bloom::before {
      background:
        radial-gradient(ellipse 36% 65% at 39% -8%, color-mix(in srgb, var(--magenta) 42%, transparent) 35%, transparent 85%),
        radial-gradient(ellipse 26% 62% at 55% 29%, color-mix(in srgb, var(--violet) 40%, transparent) 35%, transparent 90%),
        radial-gradient(ellipse 29% 58% at 12% 100%, color-mix(in srgb, var(--magenta-lift) 44%, transparent) 35%, transparent 85%),
        radial-gradient(ellipse 36% 49% at 46% 97%, color-mix(in srgb, var(--blue-lift) 42%, transparent) 35%, transparent 85%);
    }

    .terrazzo-fragment::before {
      inset: auto;
      width: 4.5%; height: 12%; left: 13%; top: 23%;
      border-radius: 25% 64% 32% 18%;
      background: color-mix(in srgb, var(--violet) 35%, transparent);
      box-shadow: 20cqw -2cqw 0 color-mix(in srgb, var(--magenta) 35%, transparent), 41cqw 5cqw 0 color-mix(in srgb, var(--blue-lift) 42%, transparent),
        16cqw 18cqw 0 color-mix(in srgb, var(--indigo) 44%, transparent), 56cqw 25cqw 0 color-mix(in srgb, var(--teal) 48%, transparent);
      transform: rotate(-19deg);
    }
    .terrazzo-fragment::after {
      inset: auto;
      width: 3%; height: 9%; left: 27%; top: 65%;
      border-radius: 55% 18% 42% 30%;
      background: color-mix(in srgb, var(--magenta-lift) 40%, transparent);
      box-shadow: -17cqw -11cqw 0 color-mix(in srgb, var(--violet) 38%, transparent), 22cqw -22cqw 0 color-mix(in srgb, var(--blue-lift) 38%, transparent),
        37cqw -7cqw 0 color-mix(in srgb, var(--indigo) 45%, transparent), 52cqw -28cqw 0 color-mix(in srgb, var(--teal) 45%, transparent);
      transform: rotate(23deg);
    }

    .tropical-tide::before {
      background:
        radial-gradient(ellipse 54% 31% at 26% 117%, color-mix(in srgb, var(--magenta) 42%, transparent) 48%, transparent 85%),
        radial-gradient(ellipse 46% 26% at 52% 88%, color-mix(in srgb, var(--blue-lift) 46%, transparent) 46%, transparent 90%),
        radial-gradient(ellipse 45% 23% at 58% 44%, color-mix(in srgb, var(--teal) 42%, transparent) 43%, transparent 95%);
      transform: rotate(-8deg) scale(1.1);
    }

    @media (max-width: 920px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="gallery" aria-label="Background gradient gallery">
    <figure>
      <div class="swatch arc-bands" data-gradient="arc-bands-background" role="img" aria-label="Arc Bands"></div>
      <figcaption>Arc Bands</figcaption>
    </figure>
    <figure>
      <div class="swatch aurora" data-gradient="aurora-background" role="img" aria-label="Aurora Background"></div>
      <figcaption>Aurora Background</figcaption>
    </figure>
    <figure>
      <div class="swatch cherry-petal" data-gradient="cherry-petal-background" role="img" aria-label="Cherry Petal"></div>
      <figcaption>Cherry Petal</figcaption>
    </figure>
    <figure>
      <div class="swatch coral-glow" data-gradient="coral-glow-background" role="img" aria-label="Coral Glow"></div>
      <figcaption>Coral Glow</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-arc-bands" data-gradient="dark-arc-bands-background" role="img" aria-label="Dark Arc Bands"></div>
      <figcaption>Dark Arc Bands</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-aurora" data-gradient="dark-aurora-background" role="img" aria-label="Dark Aurora"></div>
      <figcaption>Dark Aurora</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-carbon-spotlight" data-gradient="dark-carbon-spotlight-background" role="img" aria-label="Dark Carbon Spotlight"></div>
      <figcaption>Dark Carbon Spotlight</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-ember" data-gradient="dark-ember-background" role="img" aria-label="Dark Ember"></div>
      <figcaption>Dark Ember</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-ink-field" data-gradient="dark-ink-field-background" role="img" aria-label="Dark Ink Field"></div>
      <figcaption>Dark Ink Field</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-midnight-mesh" data-gradient="dark-midnight-mesh-background" role="img" aria-label="Dark Midnight Mesh"></div>
      <figcaption>Dark Midnight Mesh</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-rose-noir" data-gradient="dark-rose-noir-background" role="img" aria-label="Dark Rose Noir"></div>
      <figcaption>Dark Rose Noir</figcaption>
    </figure>
    <figure>
      <div class="swatch dark-teal-depth" data-gradient="dark-teal-depth-background" role="img" aria-label="Dark Teal Depth"></div>
      <figcaption>Dark Teal Depth</figcaption>
    </figure>
    <figure>
      <div class="swatch frost-mesh" data-gradient="frost-mesh-background" role="img" aria-label="Frost Mesh"></div>
      <figcaption>Frost Mesh</figcaption>
    </figure>
    <figure>
      <div class="swatch halftone-pop" data-gradient="halftone-pop-background" role="img" aria-label="Halftone Pop"></div>
      <figcaption>Halftone Pop</figcaption>
    </figure>
    <figure>
      <div class="swatch honey-ember" data-gradient="honey-ember-background" role="img" aria-label="Honey Ember"></div>
      <figcaption>Honey Ember</figcaption>
    </figure>
    <figure>
      <div class="swatch ink-wash" data-gradient="ink-wash-background" role="img" aria-label="Ink Wash"></div>
      <figcaption>Ink Wash</figcaption>
    </figure>
    <figure>
      <div class="swatch linen-weave" data-gradient="linen-weave-background" role="img" aria-label="Linen Weave"></div>
      <figcaption>Linen Weave</figcaption>
    </figure>
    <figure>
      <div class="swatch mint-lagoon" data-gradient="mint-lagoon-background" role="img" aria-label="Mint Lagoon"></div>
      <figcaption>Mint Lagoon</figcaption>
    </figure>
    <figure>
      <div class="swatch paper-fold" data-gradient="paper-fold-background" role="img" aria-label="Paper Fold"></div>
      <figcaption>Paper Fold</figcaption>
    </figure>
    <figure>
      <div class="swatch rain-prism" data-gradient="rain-prism-background" role="img" aria-label="Rain Prism"></div>
      <figcaption>Rain Prism</figcaption>
    </figure>
    <figure>
      <div class="swatch sand-drift" data-gradient="sand-drift-background" role="img" aria-label="Sand Drift"></div>
      <figcaption>Sand Drift</figcaption>
    </figure>
    <figure>
      <div class="swatch soft-spotlight" data-gradient="soft-spotlight-background" role="img" aria-label="Soft Spotlight"></div>
      <figcaption>Soft Spotlight</figcaption>
    </figure>
    <figure>
      <div class="swatch sunrise-horizon" data-gradient="sunrise-horizon-background" role="img" aria-label="Sunrise Horizon"></div>
      <figcaption>Sunrise Horizon</figcaption>

    <figure>
      <div class="swatch sunset-bloom" data-gradient="sunset-bloom-background" role="img" aria-label="Sunset Bloom"></div>
      <figcaption>Sunset Bloom</figcaption>

    <figure>
      <div class="swatch terrazzo-fragment" data-gradient="terrazzo-fragment-background" role="img" aria-label="Terrazzo Fragment"></div>

    <figure>
      <div class="swatch tropical-tide" data-gradient="tropical-tide-background" role="img" aria-label="Tropical Tide"></div>
      <figcaption>Tropical Tide</figcaption>
    </figure>
  </main>
</body>
