name: autofix.ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup pnpm 🌟
        uses: pnpm/action-setup@v4

      - name: Setup Node 📦
        uses: actions/setup-node@v4

      - name: Install dependencies 📦
        run: pnpm install

      - name: Check Outlook bridge source and installer contracts
        shell: bash
        run: |
          env -u DATABASE_URL -u VITEST_ALLOW_PILOT_RDS pnpm --filter @zero/mail exec vitest run \
            tests/workstation-bridge-protocol.test.tsx tests/outlook-pane-render.test.tsx
          if test -f apps/server-pilot/vsto/NavaOutlookAddin/ThisAddIn.cs; then
            env -u DATABASE_URL -u VITEST_ALLOW_PILOT_RDS pnpm --filter @zero/server exec vitest run \
              tests/vsto-source-contract.test.ts tests/outlook-addin-installer-nginx.test.ts
          else
            echo '::warning::Private VSTO submodule unavailable; native source and installer contracts NOT verified in root CI. Before merging or publishing, require a successful "Outlook VSTO installer" workflow in kufupa/nava-outlook-addin for the exact gitlink SHA and a Classic Outlook runtime smoke test.'
          fi

      - name: Lint JS
        run: pnpm dlx oxlint@latest --deny-warnings --ignore-pattern 'external/**'

      - name: Test Rocketseed mail flow
        shell: bash
        run: |
          unset DATABASE_URL TEST_DATABASE_URL CONFIRM_DISPOSABLE_TEST_DB VITEST_ALLOW_PILOT_RDS
          export MAIL_TRANSPORT_MODE=fixture
          pnpm --dir apps/server-pilot run test:rocketseed

      - name: Build mail applications
        run: |
          pnpm --dir apps/server-pilot build
          pnpm --dir apps/mail build

  rocketseed-transactional:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    env:
      DISPOSABLE_POSTGRES_DB: zero_transactional
      DISPOSABLE_POSTGRES_USER: postgres
      DISPOSABLE_POSTGRES_HOST: 127.0.0.1
      DISPOSABLE_POSTGRES_SSLMODE: disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zero_transactional
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d zero_transactional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup pnpm 🌟
        uses: pnpm/action-setup@v4

      - name: Setup Node 📦
        uses: actions/setup-node@v4

      - name: Install dependencies 📦
        run: pnpm install

      - name: Migrate disposable Postgres
        shell: bash
        env:
          DISPOSABLE_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          printf -v TEST_DATABASE_URL '%s%s%s%s%s%s%s%s%s%s%s' \
            'postgres' 'ql://' "$DISPOSABLE_POSTGRES_USER" '@' \
            "$DISPOSABLE_POSTGRES_HOST" ':' "$DISPOSABLE_POSTGRES_PORT" '/' \
            "$DISPOSABLE_POSTGRES_DB" '?sslmode=' "$DISPOSABLE_POSTGRES_SSLMODE"
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --dir apps/server-pilot db:migrate

      - name: Test transactional Rocketseed mail flow
        shell: bash
        env:
          DISPOSABLE_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          unset DATABASE_URL TEST_DATABASE_URL VITEST_ALLOW_PILOT_RDS HMS_DB_TEST_REQUIRED ROCKETSEED_TRANSACTIONAL_TEST_REQUIRED
          printf -v TEST_DATABASE_URL '%s%s%s%s%s%s%s%s%s%s%s' \
            'postgres' 'ql://' "$DISPOSABLE_POSTGRES_USER" '@' \
            "$DISPOSABLE_POSTGRES_HOST" ':' "$DISPOSABLE_POSTGRES_PORT" '/' \
            "$DISPOSABLE_POSTGRES_DB" '?sslmode=' "$DISPOSABLE_POSTGRES_SSLMODE"
          export TEST_DATABASE_URL
          MAIL_TRANSPORT_MODE=fixture CONFIRM_DISPOSABLE_TEST_DB=1 ROCKETSEED_TRANSACTIONAL_TEST_REQUIRED=1 pnpm --dir apps/server-pilot exec vitest run --maxWorkers=1 \
            tests/rocketseed-returned-copy-reconciliation.test.ts \
            tests/outbound-delivery-outcome.test.ts \
            tests/outbound-claim-lease.test.ts \
            tests/attachment-access.test.ts \
            tests/pop3-worker.test.ts \
            tests/candidate-attachment-cleanup-queue.test.ts \
            tests/rehydrate-raw-mime.test.ts \
            tests/promote-quarantine.test.ts
