name: autofix.ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup pnpm 🌟
        uses: pnpm/action-setup@v4

      - name: Setup Node 📦
        uses: actions/setup-node@v4

      - name: Install dependencies 📦
        run: pnpm install

      - name: Lint JS
        run: pnpm dlx oxlint@latest --deny-warnings

      - name: Test Rocketseed mail flow
        shell: bash
        run: |
          unset DATABASE_URL TEST_DATABASE_URL CONFIRM_DISPOSABLE_TEST_DB VITEST_ALLOW_PILOT_RDS
          export MAIL_TRANSPORT_MODE=fixture
          pnpm --dir apps/server-pilot run test:rocketseed

      - name: Build mail applications
        run: |
          pnpm --dir apps/server-pilot build
          pnpm --dir apps/mail build
