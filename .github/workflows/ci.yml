name: autofix.ci

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNNER_IMAGE || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code 🛎
        uses: actions/checkout@v4

      - name: Setup pnpm 🌟
        uses: pnpm/action-setup@v4

      - name: Setup Node 📦
        uses: actions/setup-node@v4

      - name: Install dependencies 📦
        run: pnpm install

      - name: Lint JS
        run: pnpm dlx oxlint@latest --deny-warnings

      - name: Test Rocketseed network-free server flow
        run: |
          unset DATABASE_URL VITEST_ALLOW_PILOT_RDS
          pnpm --dir apps/server-pilot run test:rocketseed

      - name: Test frontend CID handling
        run: |
          unset DATABASE_URL VITEST_ALLOW_PILOT_RDS
          pnpm --dir apps/mail exec vitest run tests/mail-content-fallback.test.ts

      - name: Build pilot server
        run: pnpm --dir apps/server-pilot run build

      - name: Build mail frontend
        run: pnpm --dir apps/mail run build
