# Builds NavaOutlookSetup.exe on GitHub-hosted Windows.
# Pin windows-2022: windows-latest/VS 2026 dropped VSTO runtime.
name: Outlook VSTO installer

on:
  workflow_dispatch:
  push:
    branches:
      - ci/outlook-vsto-build

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Locate Office / VSTO reference paths
        id: refs
        run: |
          $pia = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Shared\Visual Studio Tools for Office\PIA\Office15"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -property installationPath
          $refAsm = Join-Path $vs "Common7\IDE\ReferenceAssemblies\v4.0"
          $searchRoots = @(
            (Join-Path $vs "MSBuild"),
            "${env:ProgramFiles(x86)}\MSBuild",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022"
          ) | Where-Object { Test-Path $_ }
          $targets = foreach ($root in $searchRoots) {
            Get-ChildItem -Path $root -Recurse -Filter "Microsoft.VisualStudio.Tools.Office*.targets" -ErrorAction SilentlyContinue
          }
          $targets | Select-Object -ExpandProperty FullName -Unique | ForEach-Object { Write-Host "FOUND $_" }
          $outlook = $targets | Where-Object { $_.Name -eq "Microsoft.VisualStudio.Tools.Office.Outlook.targets" } | Select-Object -First 1
          $office = $targets | Where-Object { $_.Name -eq "Microsoft.VisualStudio.Tools.Office.targets" } | Select-Object -First 1
          $chosen = if ($outlook) { $outlook } else { $office }
          if (-not $chosen) { throw "No VSTO Office*.targets on runner" }
          $vsToolsPath = Split-Path (Split-Path $chosen.FullName -Parent) -Parent
          Write-Host "VS=$vs"
          Write-Host "PIA exists=$(Test-Path $pia) path=$pia"
          Write-Host "RefAsm exists=$(Test-Path $refAsm) path=$refAsm"
          Write-Host "VSToolsPath=$vsToolsPath"
          Write-Host "Chosen targets=$($chosen.FullName)"
          Get-ChildItem $refAsm -Filter "*Office.Tools*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "REFASM $($_.Name)" }
          Get-ChildItem $refAsm -Filter "*VisualStudio.Tools*" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "REFASM $($_.Name)" }
          "vs=$vs" >> $env:GITHUB_OUTPUT
          "pia=$pia" >> $env:GITHUB_OUTPUT
          "refAsm=$refAsm" >> $env:GITHUB_OUTPUT
          "vsToolsPath=$vsToolsPath" >> $env:GITHUB_OUTPUT

      - name: Create temporary ClickOnce signing cert
        id: cert
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigning `
            -Subject "CN=NavaOutlookAddin" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -HashAlgorithm SHA256
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "thumbprint=$($cert.Thumbprint)"

      - name: Restore and build VSTO add-in
        working-directory: apps/server-pilot/vsto/NavaOutlookAddin
        run: |
          $proj = "NavaOutlookAddin.csproj"
          msbuild $proj -t:Restore -p:Configuration=Release -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild restore failed: $LASTEXITCODE" }
          $msbuildArgs = @(
            $proj,
            "-t:Rebuild",
            "-p:Configuration=Release",
            "-p:Platform=AnyCPU",
            "-p:VisualStudioVersion=17.0",
            "-p:VSToolsPath=$($env:VSTOOLS)",
            "-p:VstoRefAsm=$($env:REF_ASM)",
            "-p:VstoPia=$($env:PIA)",
            "-p:SignManifests=true",
            "-p:ManifestCertificateThumbprint=$($env:CERT_THUMB)",
            "-verbosity:minimal"
          )
          msbuild @msbuildArgs
          $dll = "bin\Release\NavaOutlookAddin.dll"
          $vsto = "bin\Release\NavaOutlookAddin.vsto"
          Get-ChildItem bin\Release -ErrorAction SilentlyContinue | Format-Table Name, Length
          if (-not (Test-Path $dll)) { throw "Missing $dll (msbuild exit $LASTEXITCODE)" }
          if (-not (Test-Path $vsto)) {
            Write-Host "VSTO targets did not emit .vsto (msbuild exit $LASTEXITCODE); generating with mage.exe"
            $mage = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows" -Recurse -Filter mage.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $mage) { throw "mage.exe not found and $vsto missing" }
            Write-Host "MAGE=$mage"
            $manifest = "bin\Release\NavaOutlookAddin.dll.manifest"
            & $mage -New Application -ToFile $manifest -FromDirectory bin\Release -Name NavaOutlookAddin -Version 1.0.0.0 -Processor msil
            if ($LASTEXITCODE -ne 0) { throw "mage application manifest failed" }
            & $mage -New Deployment -ToFile $vsto -AppManifest $manifest -Name NavaOutlookAddin -Version 1.0.0.0 -Install false
            if ($LASTEXITCODE -ne 0) { throw "mage deployment manifest failed" }
            if ($env:CERT_THUMB) {
              & $mage -Sign $manifest -CertHash $env:CERT_THUMB
              & $mage -Sign $vsto -CertHash $env:CERT_THUMB
            }
          }
          if (-not (Test-Path $vsto)) { throw "Missing $vsto" }
          $cer = "bin\Release\NavaOutlookAddin.cer"
          $storeCert = Get-Item "Cert:\CurrentUser\My\$($env:CERT_THUMB)"
          if (-not $storeCert) { throw "Signing cert $($env:CERT_THUMB) not in CurrentUser\\My" }
          Export-Certificate -Cert $storeCert -FilePath $cer | Out-Null
          if (-not (Test-Path $cer)) { throw "Missing $cer" }
          foreach ($need in @(
            "bin\Release\NavaOutlookAddin.dll",
            "bin\Release\NavaOutlookAddin.vsto",
            "bin\Release\NavaOutlookAddin.cer",
            "bin\Release\runtimes\win-x86\native\WebView2Loader.dll",
            "bin\Release\runtimes\win-x64\native\WebView2Loader.dll",
            "bin\Release\Microsoft.Web.WebView2.Core.dll",
            "bin\Release\Microsoft.Web.WebView2.WinForms.dll"
          )) {
            if (-not (Test-Path $need)) { throw "Missing $need" }
          }
          Write-Host "Exported $cer ; loaders x86+x64 present"
          Get-ChildItem bin\Release -File | Format-Table Name, Length
        env:
          VSTOOLS: ${{ steps.refs.outputs.vsToolsPath }}
          REF_ASM: ${{ steps.refs.outputs.refAsm }}
          PIA: ${{ steps.refs.outputs.pia }}
          CERT_THUMB: ${{ steps.cert.outputs.thumbprint }}

      - name: Compile trust helper and fetch WebView2 bootstrapper
        working-directory: apps/server-pilot/vsto/installer
        run: |
          $csc = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw "csc.exe not found" }
          & $csc /nologo /target:exe /out:RegisterTrust.exe RegisterTrust.cs
          if ($LASTEXITCODE -ne 0) { throw "csc RegisterTrust.exe failed: $LASTEXITCODE" }
          if (-not (Test-Path RegisterTrust.exe)) { throw "Missing RegisterTrust.exe" }
          $wv2 = "MicrosoftEdgeWebview2Setup.exe"
          $urls = @(
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703",
            "https://go.microsoft.com/fwlink/?linkid=2124703"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $wv2 -UseBasicParsing
              if ((Get-Item $wv2).Length -gt 100000) { $ok = $true; break }
            } catch {
              Write-Host "WebView2 bootstrapper download failed from $url : $_"
            }
          }
          if (-not $ok) { throw "WebView2 bootstrapper missing" }
          Get-Item RegisterTrust.exe, $wv2 -ErrorAction SilentlyContinue | Format-List Name, Length

      - name: Compile Inno Setup installer
        working-directory: apps/server-pilot/vsto/installer
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "ISCC=$iscc"
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          if (-not (Test-Path "NavaOutlookSetup.exe")) { throw "Missing NavaOutlookSetup.exe" }
          Get-Item NavaOutlookSetup.exe | Format-List FullName, Length, LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NavaOutlookSetup
          path: apps/server-pilot/vsto/installer/NavaOutlookSetup.exe
          if-no-files-found: error
          retention-days: 14
